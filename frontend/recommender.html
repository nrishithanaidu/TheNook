<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nook - Oracle Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&family=Cinzel:wght@400;700&display=swap');

        :root {
            --primary-orange: #fb923c;
            --bg-dark: #0a0a0a;
            --nook-red: #8b0000;
            --nook-gold: #c5a059;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }

        .serif {
            font-family: 'Crimson Pro', serif;
        }

        .brand-font {
            font-family: 'Cinzel', serif;
        }

        /* --- Animations --- */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fade-in 0.6s ease-out forwards;
        }

        /* --- Scrollbar --- */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* --- Background Effects --- */
        .wood-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }
        
        .dust-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        .sunbeam-container {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 20% 20%, rgba(255, 230, 150, 0.05) 0%, transparent 50%);
            transform: rotate(12deg);
            pointer-events: none;
        }

        /* --- Nook Header Styles --- */
        .nook-header {
            background-color: #000;
            border-bottom: 2px solid var(--nook-gold);
        }

        .profile-ring {
            border: 2px solid #fff;
            padding: 2px;
        }
    </style>
</head>
<body class="selection:bg-orange-200">

    <!-- Background Layer -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-br from-[#1a1412] via-[#0a0a0a] to-[#000000]"></div>
        <div class="absolute inset-0 opacity-20 mix-blend-overlay wood-pattern"></div>
        <div class="sunbeam-container"></div>
        <div class="absolute inset-0 opacity-[0.02] dust-pattern"></div>
    </div>

    <!-- Main App Container -->
    <div class="relative z-10 flex flex-col h-screen">
        
        <!-- UPDATED HEADER: THE NOOK -->
        <header class="nook-header flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-6">
                <!-- Nook Logo -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full border-2 border-[#c5a059] flex items-center justify-center bg-[#8b0000]">
                        <span class="brand-font text-white text-xl font-bold">N</span>
                    </div>
                    <span class="brand-font text-white text-3xl tracking-wide font-bold">The Nook</span>
                </div>
            </div>

            <!-- Profile / Guest Section -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border-2 border-white flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <span class="brand-font text-white text-xl uppercase tracking-widest font-bold">Guest</span>
            </div>
        </header>

        <!-- Chat Main Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 md:p-8 overflow-hidden">
            <div class="relative w-full max-w-6xl h-[75vh] flex flex-col bg-black/40 backdrop-blur-md border border-white/5 rounded-sm shadow-2xl overflow-hidden">
                
                <!-- Inner Chat Header (Secondary) -->
                <div class="flex items-center justify-between px-8 py-3 bg-white/5 border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-orange-400 rounded-full animate-pulse shadow-[0_0_5px_rgba(251,146,60,0.8)]"></div>
                        <span class="text-[9px] tracking-[0.4em] text-orange-200/40 uppercase font-bold">Oracle Active</span>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="chat-area" class="flex-1 overflow-y-auto p-8 space-y-12 no-scrollbar scroll-smooth">
                    <!-- Initial Message -->
                    <div class="flex flex-col items-start group animate-fade-in">
                        <span id="oracle-label" class="text-[10px] tracking-widest uppercase mb-2 text-orange-400/70">The Oracle</span>
                        <div class="relative px-6 py-4 max-w-[80%] bg-orange-950/10 border border-orange-400/10 rounded-tr-2xl rounded-tl-sm rounded-bl-sm rounded-br-2xl text-orange-50/90 backdrop-blur-sm">
                            <p id="welcome-text" class="text-xl leading-relaxed serif tracking-wide italic">
                                Welcome, Seeker. I have been expecting you. How can I help you today?
                            </p>
                            <div class="absolute inset-0 opacity-5 pointer-events-none bg-gradient-to-br from-white/20 to-transparent"></div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div id="typing-indicator" class="hidden px-8 pb-4 flex items-center gap-2 text-orange-400/40 animate-pulse">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
                    <span class="text-[10px] tracking-widest italic uppercase">Reading the mists...</span>
                </div>

                <!-- Chat Input Area -->
                <footer class="p-8 bg-black/60 border-t border-white/5">
                    <form id="chat-form" class="relative max-w-4xl mx-auto">
                        <input
                            id="user-input"
                            type="text"
                            placeholder="WHAT IS YOUR QUEST?"
                            autocomplete="off"
                            class="w-full bg-white/5 border border-white/10 rounded-full px-8 py-5 text-lg outline-none focus:border-orange-500/30 focus:bg-white/10 transition-all placeholder:text-white/5 text-white/90 shadow-2xl"
                        >
                        <button 
                            type="submit"
                            class="absolute right-4 top-1/2 -translate-y-1/2 p-2 text-white/20 hover:text-orange-400 transition-all"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                        
                        <div class="absolute -left-4 top-1/2 -translate-y-1/2 w-1 h-8 bg-orange-400/20"></div>
                        <div class="absolute -right-4 top-1/2 -translate-y-1/2 w-1 h-8 bg-orange-400/20"></div>
                    </form>
                    <p class="text-center mt-4 text-[8px] text-white/5 tracking-[0.8em] uppercase">
                        Spirit of Delphi // Forgotten Archives
                    </p>
                </footer>
            </div>
        </div>
    </div>


    <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatArea = document.getElementById('chat-area');
    const typingIndicator = document.getElementById('typing-indicator');

    const userName = "Seeker";

    function createMessageElement(role, text) {
        const isUser = role === 'user';
        const container = document.createElement('div');
        container.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} group animate-fade-in`;

        const label = isUser ? userName : 'The Oracle';
        const labelColor = isUser ? 'text-white/20' : 'text-orange-400/50';

        const bubbleBg = isUser
            ? 'bg-white/5 border border-white/10 rounded-tl-2xl rounded-tr-sm rounded-br-sm rounded-bl-2xl text-white/70'
            : 'bg-orange-950/10 border border-orange-400/10 rounded-tr-2xl rounded-tl-sm rounded-bl-sm rounded-br-2xl text-orange-50/90';

        container.innerHTML = `
            <span class="text-[9px] tracking-[0.3em] uppercase mb-2 ${labelColor}">${label}</span>
            <div class="relative px-6 py-4 max-w-[85%] ${bubbleBg} backdrop-blur-sm">
                <p class="text-xl leading-relaxed serif tracking-wide italic">${text}</p>
                <div class="absolute inset-0 opacity-5 pointer-events-none bg-gradient-to-br from-white/10 to-transparent"></div>
            </div>
        `;

        return container;
    }

    async function sendMessageToMLModel(text) {
    typingIndicator.classList.remove('hidden');

    try {
        // 1. Send user's emotion text
        console.log("calling backend...");
        await fetch("http://127.0.0.1:5000/api/emotion/log", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: "guest",
                media_id: "unknown",
                emotion_text: text
            })
        });

        // 2. Ask backend for recommendations
        console.log("calling backend...");
        const response = await fetch("http://127.0.0.1:5000/api/recommend", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: "guest"
            })
        });

        const data = await response.json();

        let reply = "The Oracle peers into the archives...\n\n";

        if (data.recommendations.length === 0) {
            reply += "I need to learn more of your tastes before guiding you.";
        } else {
            data.recommendations.forEach((item, index) => {
                reply += `${index + 1}. ${item.title} (${item.type})\n`;
            });
        }

        const msg = createMessageElement("oracle", reply);
        chatArea.appendChild(msg);

    } catch (err) {
        console.error("BACKEND ERROR:", err);
        const msg = createMessageElement(
            "oracle",
            "The mists are disturbed. I cannot reach the archives right now."
        );
        chatArea.appendChild(msg);
    }

    typingIndicator.classList.add('hidden');
    chatArea.scrollTop = chatArea.scrollHeight;
}
chatForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const text = userInput.value.trim();
    if (!text) return;

    // show user message
    const userMsg = createMessageElement("user", text);
    chatArea.appendChild(userMsg);

    userInput.value = "";
    chatArea.scrollTop = chatArea.scrollHeight;

    // SEND TO BACKEND
    await sendMessageToMLModel(text);
});

    </script>
</body>
</html>
