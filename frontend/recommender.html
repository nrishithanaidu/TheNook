<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Nook - Oracle Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&family=Cinzel:wght@400;700&display=swap');

        :root {
            --primary-orange: #fb923c;
            --bg-dark: #0a0a0a;
            --nook-red: #8b0000;
            --nook-gold: #c5a059;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }

        .serif {
            font-family: 'Crimson Pro', serif;
        }

        .brand-font {
            font-family: 'Cinzel', serif;
        }

        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fade-in 0.6s ease-out forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .wood-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
        }
        
        .dust-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        .sunbeam-container {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 150%;
            height: 150%;
            background: radial-gradient(circle at 20% 20%, rgba(255, 230, 150, 0.05) 0%, transparent 50%);
            transform: rotate(12deg);
            pointer-events: none;
        }

        .nook-header {
            background-color: #000;
            border-bottom: 2px solid var(--nook-gold);
        }

        .profile-ring {
            border: 2px solid #fff;
            padding: 2px;
        }
    </style>
</head>
<body class="selection:bg-orange-200 text-white">

    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute inset-0 bg-gradient-to-br from-[#1a1412] via-[#0a0a0a] to-[#000000]"></div>
        <div class="absolute inset-0 opacity-20 mix-blend-overlay wood-pattern"></div>
        <div class="sunbeam-container"></div>
        <div class="absolute inset-0 opacity-[0.02] dust-pattern"></div>
    </div>

    <div class="relative z-10 flex flex-col h-screen">
        
        <header class="nook-header flex items-center justify-between px-6 py-4">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full border-2 border-[#c5a059] flex items-center justify-center bg-[#8b0000]">
                        <span class="brand-font text-white text-xl font-bold">N</span>
                    </div>
                    <span class="brand-font text-white text-3xl tracking-wide font-bold">The Nook</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border-2 border-white flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <span class="brand-font text-white text-xl uppercase tracking-widest font-bold">Guest</span>
            </div>
        </header>

        <div class="flex-1 flex flex-col items-center justify-center p-4 md:p-8 overflow-hidden">
            <div class="relative w-full max-w-6xl h-[75vh] flex flex-col bg-black/40 backdrop-blur-md border border-white/5 rounded-sm shadow-2xl overflow-hidden">
                
                <div class="flex items-center justify-between px-8 py-3 bg-white/5 border-b border-white/5">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-orange-400 rounded-full animate-pulse shadow-[0_0_5px_rgba(251,146,60,0.8)]"></div>
                        <span class="text-[9px] tracking-[0.4em] text-orange-200/40 uppercase font-bold">Oracle Active</span>
                    </div>
                </div>

                <div id="chat-area" class="flex-1 overflow-y-auto p-8 space-y-12 no-scrollbar scroll-smooth">
                    <div class="flex flex-col items-start group animate-fade-in">
                        <span id="oracle-label" class="text-[10px] tracking-widest uppercase mb-2 text-orange-400/70">The Oracle</span>
                        <div class="relative px-6 py-4 max-w-[80%] bg-orange-950/10 border border-orange-400/10 rounded-tr-2xl rounded-tl-sm rounded-bl-sm rounded-br-2xl text-orange-50/90 backdrop-blur-sm">
                            <p id="welcome-text" class="text-xl leading-relaxed serif tracking-wide italic">
                                Welcome, Seeker. I have been expecting you. How can I help you today?
                            </p>
                        </div>
                    </div>
                </div>

                <div id="typing-indicator" class="hidden px-8 pb-4 flex items-center gap-2 text-orange-400/40 animate-pulse">
                    <span class="text-[10px] tracking-widest italic uppercase">Reading the mists...</span>
                </div>

                <footer class="p-8 bg-black/60 border-t border-white/5">
                    <form id="chat-form" class="relative max-w-4xl mx-auto">
                        <input
                            id="user-input"
                            type="text"
                            placeholder="WHAT IS YOUR QUEST?"
                            autocomplete="off"
                            class="w-full bg-white/5 border border-white/10 rounded-full px-8 py-5 text-lg outline-none"
                        >
                    </form>
                </footer>
            </div>
        </div>
    </div>

    <<script type="module">
import Auth from "./auth.js";

const chatForm = document.getElementById("chat-form");
const userInput = document.getElementById("user-input");
const chatArea = document.getElementById("chat-area");
const typingIndicator = document.getElementById("typing-indicator");

function createMessageElement(role, text) {
    const isUser = role === "user";

    const container = document.createElement("div");
    container.className = `flex flex-col ${
    isUser ? "items-end" : "items-start"
    } group animate-fade-in`;

    const bubbleBg = isUser
    ? "bg-white/10 border border-white/20 text-white"
    : "bg-orange-950/20 border border-orange-400/20 text-orange-50";

    const labelColor = isUser ? "text-white/40" : "text-orange-400/70";

    container.innerHTML = `
    <span class="text-[9px] tracking-widest uppercase mb-2 ${labelColor}">
      ${isUser ? "Seeker" : "The Oracle"}
    </span>
    <div class="px-6 py-4 max-w-[85%] rounded-xl ${bubbleBg}">
      <p class="text-xl serif italic leading-relaxed">${text}</p>
    </div>
  `;

  return container;
}

async function sendMessageToMLModel(text) {
  typingIndicator.classList.remove("hidden");

  try {
    // Emotion log
    await Auth.apiCall("/api/emotion/log", {
      method: "POST",
      body: JSON.stringify({
        media_id: "unknown",
        media_type: "movie",
        emotion_text: text
      })
    });

    // Recommendations
    const response = await Auth.apiCall("/api/recommend", {
      method: "POST",
      body: JSON.stringify({
        desired_mood: text,
        media_type: "movie",
        limit: 5
      })
    });

    const data = await response.json();

    let reply = "The Oracle peers into the archives...\n\n";

    if (!data.recommendations || data.recommendations.length === 0) {
      reply += "I need to learn more of your tastes before guiding you.";
    } else {
      data.recommendations.forEach((item, index) => {
        reply += `${index + 1}. ${item.title}\n`;
      });
    }

    chatArea.appendChild(createMessageElement("oracle", reply));
  } catch (err) {
    console.error("BACKEND ERROR:", err);

    chatArea.appendChild(
      createMessageElement(
        "oracle",
        "The mists are disturbed. I cannot reach the archives right now."
      )
    );
  }

  typingIndicator.classList.add("hidden");
  chatArea.scrollTop = chatArea.scrollHeight;
}

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const text = userInput.value.trim();
  if (!text) return;

  chatArea.appendChild(createMessageElement("user", text));
  userInput.value = "";

  await sendMessageToMLModel(text);
});
</script>

</body>
</html>
