<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>The Nook Cinema — Box Office</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        :root {
            --bg-deep: #050508; --bg-panel: #12050a; --bg-panel-alt: #1b060b;
            --red-deep: #2b0508; --red-main: #4d080c; --red-light: #7c1118; 
            --gold: #ffc857; --gold-soft: #ffdf99; --text-main: #f8e9d9;
            --text-muted: #c7b3a1; --success: #28a745; --error: #dc3545;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: "EB Garamond", serif; background: radial-gradient(circle at top, #111018 0, #050508 45%, #000 100%); color: var(--text-main); overflow-x: hidden; }
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 80px; opacity: 0; transition: opacity 1s ease-in; }
        .page-wrap.visible { opacity: 1; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .logo { font-family: "Cinzel", serif; font-size: 1.8rem; color: var(--gold); cursor: pointer; }
        .status-badge { font-size: 0.7rem; padding: 4px 8px; border-radius: 12px; text-transform: uppercase; font-weight: bold; color: white; background: #999; }
        .status-online { background: var(--success); }
        .status-offline { background: var(--error); }
        .bo-header-outer { margin-top: 8px; padding: 18px; border-radius: 22px; border: 2px solid rgba(255, 200, 87, 0.9); background: radial-gradient(circle at top, rgba(255,255,255,0.06) 0, transparent 55%); box-shadow: 0 0 15px rgba(255, 200, 87, 0.6); animation: pulseGlow 2.5s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px rgba(255, 200, 87, 0.6); } 100% { box-shadow: 0 0 20px var(--gold); } }
        .bo-header-inner { border-radius: 16px; padding: 24px; text-align: center; background: linear-gradient(180deg, var(--red-light), var(--red-deep)); }
        .bo-title { font-family: "Cinzel", serif; font-size: clamp(28px, 4vw, 40px); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
        #curtain-overlay { position: fixed; inset: 0; background: var(--bg-deep); z-index: 5000; display: flex; justify-content: center; align-items: center; }
        .curtain { width: 50%; height: 100%; background: var(--red-light); transition: transform 1.2s ease-in-out; position: absolute; box-shadow: inset 0 0 50px #000; }
        #left-curtain { left: 0; } #right-curtain { right: 0; }
        #left-curtain.open { transform: translateX(-100%); } #right-curtain.open { transform: translateX(100%); }
        #curtain-overlay.fade-out { opacity: 0; transition: opacity 0.5s 1s; pointer-events: none; }
        .action-text { font-size: 6vw; color: var(--gold); font-family: "Cinzel", serif; z-index: 5001; transition: 0.4s; }
        .action-text.hidden { opacity: 0; transform: scale(1.5); }
        .achievements-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .achievement-card { background: #1b060b; border: 1px solid rgba(255, 200, 87, 0.3); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 15px; }
        .ach-icon { width: 45px; height: 45px; background: rgba(255, 200, 87, 0.1); border: 1px solid var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--gold); }
        .btn-gold { background: linear-gradient(180deg, #5a090f, #120104); border: 1px solid var(--gold); color: var(--gold); padding: 10px 20px; border-radius: 999px; font-family: "Cinzel"; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-gold:hover { background: var(--gold); color: #000; }
        .section { margin-top: 40px; }
        .section-banner { margin: 0 auto 18px; max-width: 600px; text-align: center; padding: 12px; border-radius: 999px; background: linear-gradient(180deg, #5a090f, #120104); border: 1px solid var(--gold); font-family: "Cinzel"; color: var(--gold); letter-spacing: 2px; }
        .card-row { display: flex; gap: 20px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .movie-card { flex: 0 0 200px; background: #130308; border-radius: 15px; border: 1px solid rgba(255, 200, 87, 0.4); padding: 10px; cursor: pointer; transition: 0.3s; }
        .movie-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .poster-wrap { border-radius: 10px; overflow: hidden; height: 260px; background: #000; }
        .poster-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .card-title { margin-top: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-backdrop.show { display: flex; }
        .modal-content { background: #1b060b; border: 2px solid var(--gold); border-radius: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; }
        .modal-content.compact { max-width: 450px; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--gold); font-size: 24px; cursor: pointer; }
        .modal-flex { display: flex; gap: 25px; flex-wrap: wrap; }
        .modal-left { flex: 0 0 240px; }
        .modal-right { flex: 1; }
        .modal-left img { width: 100%; border-radius: 10px; border: 1px solid var(--gold); }
        .modal-content label { display: block; font-size: 10px; color: var(--gold); text-transform: uppercase; margin-top: 10px; font-family: "Cinzel"; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; background: #000; border: 1px solid var(--red-main); padding: 8px; color: var(--text-main); border-radius: 5px; margin-bottom: 10px; outline: none; }
        .view-text { margin-bottom: 10px; font-size: 1rem; color: var(--text-main); }
        .hidden { display: none !important; }
        .btn-action { padding: 8px 15px; border-radius: 999px; font-size: 10px; font-family: "Cinzel"; cursor: pointer; border: 1px solid var(--gold); background: transparent; color: var(--gold); margin-right: 5px; }
        .btn-action:hover { background: var(--gold); color: #000; }
        .btn-danger { border-color: #ff4444; color: #ff4444; }
        .btn-danger:hover { background: #ff4444; color: #fff; }

        /* Results List styling */
        #magic-results { background: rgba(0,0,0,0.95); border: 1px solid var(--gold); border-radius: 8px; margin-bottom: 15px; max-height: 250px; overflow-y: auto; }
        .magic-item { display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,200,87,0.2); }
        .magic-item:hover { background: rgba(255,200,87,0.15); }
        .magic-item img { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--gold); }
        .magic-item b { display: block; font-size: 14px; color: var(--gold); }
        .magic-item span { font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div id="curtain-overlay"><div id="left-curtain" class="curtain"></div><div id="right-curtain" class="curtain"></div><div id="action-text" class="action-text">ACTION!</div></div>
    <div class="page-wrap" id="pageWrap">
        <nav>
            <div class="logo-group"><div class="logo">THE NOOK</div><div id="connectionStatus" class="status-badge">Checking...</div></div>
            <button class="btn-gold" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add Movie</button>
        </nav>
        <header class="bo-header-outer"><div class="bo-header-inner"><div class="bo-title"><i class="fa-solid fa-film"></i> BOX OFFICE <i class="fa-solid fa-film"></i></div><div style="font-family: Cinzel; letter-spacing: 3px; font-size: 12px; color: var(--gold-soft);">THE NOOK CINEMA</div></div></header>
        <section class="achievements-row">
            <div class="achievement-card"><div class="ach-icon"><i class="fa-solid fa-clapperboard"></i></div><div class="ach-info"><b id="stat-films">0</b><span>Films Collected</span></div></div>
            <div class="achievement-card"><div class="ach-icon"><i class="fa-solid fa-masks-theater"></i></div><div class="ach-info"><b id="stat-genres">0</b><span>Genres Explored</span></div></div>
            <div class="achievement-card"><div class="ach-icon"><i class="fa-solid fa-hourglass-half"></i></div><div class="ach-info"><b id="stat-runtime">0 min</b><span>Total Runtime</span></div></div>
        </section>
        <div style="margin-top: 30px;"><input type="text" class="search-input" id="searchInput" placeholder="Search archives..." style="width: 100%; padding: 12px; background: #000; border: 1px solid var(--red-main); color: #fff; border-radius: 8px;" onkeyup="handleSearch()"></div>
        <section class="section"><div class="section-banner">NOW SHOWING</div><div class="card-row" id="row-now"></div></section>
        <section class="section"><div class="section-banner">PREMIERES</div><div class="card-row" id="row-prem"></div></section>
        <section class="section"><div class="section-banner">THE VAULT</div><div class="card-row" id="row-vault"></div></section>
    </div>

    <!-- ADD MOVIE MODAL -->
    <div class="modal-backdrop" id="addModalBackdrop">
        <div class="modal-content compact">
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
            <h3 style="font-family: Cinzel; color: var(--gold); margin: 0 0 15px;">Add to Library</h3>
            <label>Magic Search</label>
            <input id="importUrl" placeholder="Enter movie title and year">
            <button class="btn-gold" id="fetchBtnMovie" style="width: 100%; margin-bottom: 15px;" onclick="autoFillMovieDetails()">Magic Fetch</button>
            
            <div id="magic-results" class="hidden"></div>

            <hr style="border-color: rgba(255,200,87,0.1)">
            <input type="text" id="add-title" placeholder="Film Title (Required)">
            <input type="text" id="add-director" placeholder="Director">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="add-year" placeholder="Year">
                <input type="text" id="add-genre" placeholder="Genre">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="number" id="add-runtime" placeholder="Runtime (min)">
                <input type="text" id="add-lang" placeholder="Language">
            </div>
            <select id="add-status"><option value="Now Showing">Now Showing</option><option value="Premiere">Premiere</option><option value="Archived">The Vault</option></select>
            <input type="number" id="add-rating" min="0" max="5" placeholder="Rating (0-5)">
            <input id="add-moods" placeholder="Moods (comma separated)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>Start Date</label><input type="date" id="add-start"></div>
                <div><label>Finish Date</label><input type="date" id="add-finish"></div>
            </div>
            <input type="text" id="add-img" placeholder="Poster URL">
            <textarea id="add-synopsis" placeholder="Synopsis"></textarea>
            <textarea id="add-review" placeholder="Your Review"></textarea>
            <button class="btn-gold" style="width: 100%;" onclick="addNewFilm()">Acquire Film</button>
        </div>
    </div>

    <!-- DETAILS MODAL -->
    <div class="modal-backdrop" id="detailsModalBackdrop">
        <div class="modal-content">
            <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
            <div class="modal-flex">
                <div class="modal-left"><img id="m-img" src="" alt="Poster"></div>
                <div class="modal-right">
                    <div id="viewMode">
                        <div id="m-title" style="font-family: Cinzel; font-size: 24px; color: var(--gold);"></div>
                        <div id="m-sub" style="color: var(--gold-soft); margin-bottom: 10px;"></div>
                        <label>Rating</label><div id="vRating" class="view-text"></div>
                        <label>Moods</label><div id="vMoods" class="view-text"></div>
                        <label>Watching Dates</label><div id="vDates" class="view-text"></div>
                        <label>Synopsis</label><div id="m-synopsis" class="view-text" style="font-style: italic;"></div>
                        <label>My Review</label><div id="vReview" class="view-text"></div>
                        <div class="modal-actions">
                            <button class="btn-action" onclick="setEditMode(true)">Edit Details</button>
                            <button class="btn-action btn-danger" onclick="deleteFilm()">Delete</button>
                        </div>
                    </div>
                    <div id="editMode" class="hidden">
                        <h3 style="font-family: Cinzel; color: var(--gold); margin-top:0;">Edit Archives</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input id="detTitle" placeholder="Title">
                            <input id="detDirector" placeholder="Director">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input id="detYear" placeholder="Year">
                            <input id="detGenre" placeholder="Genre">
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="number" id="detRuntime" placeholder="Runtime">
                            <input id="detLang" placeholder="Language">
                        </div>
                        <select id="detStatus"><option value="Now Showing">Now Showing</option><option value="Premiere">Premiere</option><option value="Archived">The Vault</option></select>
                        <input type="number" id="detRating" min="0" max="5" placeholder="Rating">
                        <input id="detMoods" placeholder="Moods">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="date" id="detStart">
                            <input type="date" id="detFinish">
                        </div>
                        <input id="detImg" placeholder="Poster URL">
                        <textarea id="detSynopsis" placeholder="Synopsis"></textarea>
                        <textarea id="detReview" placeholder="Review"></textarea>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn-gold" style="flex:1" onclick="saveEdit()">Save Changes</button>
                            <button class="btn-action" style="flex:0.5" onclick="setEditMode(false)">Cancel</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api/movies";
        let movies = [];
        let activeId = null;

        function updateStatus(isOnline) {
            const el = document.getElementById('connectionStatus');
            if (el) {
                if (isOnline) { el.textContent = "Online"; el.className = "status-badge status-online"; }
                else { el.textContent = "Offline"; el.className = "status-badge status-offline"; }
            }
        }

        async function fetchMovies() {
            try {
                // Connection heartbeat
                const health = await fetch("http://127.0.0.1:5000/api/health");
                if(!health.ok) throw new Error();
                
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error();
                movies = await res.json();
                updateStatus(true);
                renderMovies();
            } catch (err) { 
                console.error("Fetch error:", err);
                updateStatus(false); 
            }
        }

        function renderMovies() {
            const rows = { 'Now Showing': 'row-now', 'Premiere': 'row-prem', 'Archived': 'row-vault' };
            Object.values(rows).forEach(id => {
                const row = document.getElementById(id);
                if(row) row.innerHTML = "";
            });
            movies.forEach(m => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openDetailsModal(m.id);
                const imgUrl = m.img || 'https://placehold.co/200x300/1b060b/ffc857?text=No+Poster';
                card.innerHTML = `<div class="poster-wrap"><img src="${imgUrl}" alt=""></div><div class="card-title">${m.title}</div><div style="font-size:11px;color:var(--text-muted)">${m.year || 'N/A'} • ${m.genre || 'Cinema'}</div>`;
                const targetRow = document.getElementById(rows[m.status]);
                if(targetRow) targetRow.appendChild(card);
            });
            const statFilms = document.getElementById('stat-films');
            const statGenres = document.getElementById('stat-genres');
            const statRuntime = document.getElementById('stat-runtime');
            if(statFilms) statFilms.innerText = movies.length;
            if(statGenres) statGenres.innerText = new Set(movies.map(m => m.genre).filter(g => g)).size;
            if(statRuntime) statRuntime.innerText = `${movies.reduce((s, m) => s + (m.runtime || 0), 0)} min`;
        }

        async function addNewFilm() {
            const title = document.getElementById('add-title').value.trim();
            if (!title) return alert("Title is required!");
            const payload = {
                title, director: document.getElementById('add-director').value,
                year: document.getElementById('add-year').value, genre: document.getElementById('add-genre').value,
                runtime: document.getElementById('add-runtime').value, status: document.getElementById('add-status').value,
                language: document.getElementById('add-lang').value, rating: document.getElementById('add-rating').value,
                moods: document.getElementById('add-moods').value.split(',').map(s => s.trim()).filter(s => s),
                start_date: document.getElementById('add-start').value, finish_date: document.getElementById('add-finish').value,
                img: document.getElementById('add-img').value, synopsis: document.getElementById('add-synopsis').value,
                review: document.getElementById('add-review').value
            };
            try {
                const res = await fetch(API_URL, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if (res.ok) { alert("Film Acquired!"); closeAddModal(); fetchMovies(); }
            } catch (e) { alert("Server Connection Error."); }
        }

        async function autoFillMovieDetails() {
    const query = document.getElementById('importUrl').value.trim();
    if (!query) return alert("Type a film title first!");

    const btn = document.getElementById('fetchBtnMovie');
    const resultsDiv = document.getElementById('magic-results');

    btn.textContent = "Searching Movies...";
    btn.disabled = true;
    resultsDiv.innerHTML = "";
    resultsDiv.classList.add('hidden');

    try {
        // 🔑 CALL YOUR BACKEND, NOT ITUNES DIRECTLY
        const res = await fetch(
            `http://127.0.0.1:5000/api/magic-movie-search?q=${encodeURIComponent(query)}`
        );
        const data = await res.json();

        if (data.results && data.results.length > 0) {
            resultsDiv.classList.remove('hidden');

            data.results.forEach(info => {
                const item = document.createElement('div');
                item.className = 'magic-item';

                const year = info.releaseDate
                    ? info.releaseDate.substring(0, 4)
                    : 'N/A';

                item.innerHTML = `
                    <img src="${info.artworkUrl100}" alt="poster">
                    <div>
                        <b>${info.trackName}</b>
                        <span>${year} • ${info.artistName || 'Unknown'}</span>
                    </div>
                `;

                item.onclick = () => selectMovie(info);
                resultsDiv.appendChild(item);
            });

        } else {
            alert("No matching films found.");
        }
    } catch (e) {
        alert("Magic Fetch failed.");
        console.error(e);
    } finally {
        btn.textContent = "Magic Fetch";
        btn.disabled = false;
    }
}

        function selectMovie(info) {
            document.getElementById('add-title').value = info.trackName || '';
            document.getElementById('add-director').value = info.artistName || '';
            document.getElementById('add-genre').value = info.primaryGenreName || info.genre || '';
            document.getElementById('add-year').value = info.releaseDate ? info.releaseDate.substring(0, 4) : '';
            document.getElementById('add-runtime').value = info.trackTimeMillis ? Math.round(info.trackTimeMillis / 60000) : 0;
            document.getElementById('add-img').value = info.artworkUrl100 ? info.artworkUrl100.replace('100x100bb', '600x600bb') : '';
            document.getElementById('add-synopsis').value = info.longDescription || info.shortDescription || '';
            document.getElementById('magic-results').classList.add('hidden');
        }

        function openAddModal() { document.getElementById('addModalBackdrop').classList.add('show'); }
        function closeAddModal() { 
            document.getElementById('addModalBackdrop').classList.remove('show');
            document.querySelectorAll('#addModalBackdrop input, #addModalBackdrop textarea').forEach(i => i.value = "");
            document.getElementById('magic-results').classList.add('hidden');
        }

        function openDetailsModal(id) {
            activeId = id;
            const m = movies.find(x => x.id === id);
            if(!m) return;
            document.getElementById('m-title').innerText = m.title;
            document.getElementById('m-sub').innerText = `${m.director || 'Unknown'} • ${m.year || 'N/A'} • ${m.genre || 'Cinema'} • ${m.runtime || 0}m • ${m.language || 'N/A'}`;
            document.getElementById('m-synopsis').innerText = m.synopsis || 'No synopsis.';
            document.getElementById('vRating').innerText = '★'.repeat(m.rating || 0) + '☆'.repeat(5 - (m.rating || 0));
            document.getElementById('vMoods').innerText = (m.moods || []).join(', ') || 'None';
            document.getElementById('vReview').innerText = m.review || 'No review yet.';
            document.getElementById('vDates').innerText = (m.start_date || m.finish_date) ? `${m.start_date || '?'} to ${m.finish_date || '?'}` : 'No dates.';
            document.getElementById('m-img').src = m.img || 'https://placehold.co/200x300/1b060b/ffc857?text=No+Poster';
            
            // Populate Edit Modal
            document.getElementById('detTitle').value = m.title || "";
            document.getElementById('detDirector').value = m.director || "";
            document.getElementById('detGenre').value = m.genre || "";
            document.getElementById('detYear').value = m.year || "";
            document.getElementById('detRuntime').value = m.runtime || 0;
            document.getElementById('detLang').value = m.language || "";
            document.getElementById('detStatus').value = m.status;
            document.getElementById('detRating').value = m.rating || 0;
            document.getElementById('detMoods').value = (m.moods || []).join(', ');
            document.getElementById('detStart').value = m.start_date || "";
            document.getElementById('detFinish').value = m.finish_date || "";
            document.getElementById('detImg').value = m.img || "";
            document.getElementById('detSynopsis').value = m.synopsis || "";
            document.getElementById('detReview').value = m.review || "";

            setEditMode(false);
            document.getElementById('detailsModalBackdrop').classList.add('show');
        }

        function setEditMode(isEdit) {
            document.getElementById('viewMode').classList.toggle('hidden', isEdit);
            document.getElementById('editMode').classList.toggle('hidden', !isEdit);
        }

        async function saveEdit() {
            const payload = {
                title: document.getElementById('detTitle').value,
                director: document.getElementById('detDirector').value,
                genre: document.getElementById('detGenre').value,
                year: document.getElementById('detYear').value,
                runtime: document.getElementById('detRuntime').value,
                language: document.getElementById('detLang').value,
                status: document.getElementById('detStatus').value,
                rating: document.getElementById('detRating').value,
                moods: document.getElementById('detMoods').value.split(',').map(s => s.trim()).filter(s => s),
                start_date: document.getElementById('detStart').value,
                finish_date: document.getElementById('detFinish').value,
                img: document.getElementById('detImg').value,
                synopsis: document.getElementById('detSynopsis').value,
                review: document.getElementById('detReview').value
            };
            try {
                const res = await fetch(`${API_URL}/${activeId}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if(res.ok) { alert("Archives updated!"); closeDetailsModal(); fetchMovies(); }
            } catch(e) { alert("Failed to save changes."); }
        }

        async function deleteFilm() {
            if (confirm("Remove this film from the archives?")) {
                try {
                    await fetch(`${API_URL}/${activeId}`, { method: 'DELETE' });
                    alert("Film removed."); closeDetailsModal(); fetchMovies();
                } catch(e) { alert("Failed to delete."); }
            }
        }

        function closeDetailsModal() { document.getElementById('detailsModalBackdrop').classList.remove('show'); }
        
        function handleSearch() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.movie-card').forEach(c => {
                c.style.display = c.innerText.toLowerCase().includes(q) ? "block" : "none";
            });
        }

        window.onload = () => {
            fetchMovies();
            setTimeout(() => {
                const actionText = document.getElementById('action-text');
                if(actionText) actionText.classList.add('hidden');
                setTimeout(() => {
                    const leftCurtain = document.getElementById('left-curtain');
                    const rightCurtain = document.getElementById('right-curtain');
                    const curtainOverlay = document.getElementById('curtain-overlay');
                    const pageWrap = document.getElementById('pageWrap');
                    
                    if(leftCurtain) leftCurtain.classList.add('open');
                    if(rightCurtain) rightCurtain.classList.add('open');
                    if(curtainOverlay) curtainOverlay.classList.add('fade-out');
                    if(pageWrap) pageWrap.classList.add('visible');
                }, 400);
            }, 800);
        };
    </script>
</body>
</html>
