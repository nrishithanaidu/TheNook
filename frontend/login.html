
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Nook — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-parchment: #C6A878;
            --frame-parchment: #AE8C63;
            --ink-text: #2B241D;
            --highlight-sepia: #D8B67A;
            --shadow-dark: #6A553F;
            --gold-glow: rgba(255, 215, 0, 0.7);
            --emblem-red: #8B0000;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "EB Garamond", serif;
            background-color: var(--bg-parchment);
            color: var(--ink-text);
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.08),
                rgba(0, 0, 0, 0.08) 1px,
                transparent 1px,
                transparent 3px
            ),
            radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .font-title { font-family: 'IM Fell English SC', serif; }
        .font-accent { font-family: 'Kalam', cursive; }

        .nav-parchment {
            background-color: var(--frame-parchment);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            position: relative;
            padding-top: 1rem;
            padding-bottom: 1rem;
            width: 100%;
            margin-bottom: 2rem;
        }
        .nav-parchment::before, .nav-parchment::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 10px;
            background-color: var(--bg-parchment);
            z-index: 10;
        }
        .nav-parchment::before { top: -10px; }
        .nav-parchment::after { bottom: -10px; }

        .nav-link:hover {
            color: var(--ink-text);
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.8);
            cursor: pointer;
        }

        .panel {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background-color: var(--frame-parchment);
            border: 3px solid var(--ink-text);
            box-shadow: 12px 12px 0 var(--shadow-dark);
            position: relative;
            margin: 2rem auto;
        }

        .panel::before {
            content: 'N';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 50px;
            height: 50px;
            background: var(--emblem-red);
            color: white;
            font-family: 'IM Fell English SC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 2px solid var(--ink-text);
            transform: rotate(15deg);
            box-shadow: 3px 3px 0 var(--shadow-dark);
            z-index: 10;
        }

        .panel h2 {
            font-family: 'IM Fell English SC', serif;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 25px;
            color: var(--ink-text);
            text-transform: uppercase;
            letter-spacing: -1px;
            border-bottom: 2px solid rgba(43, 36, 29, 0.2);
            padding-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0 16px;
            border: 2px solid var(--ink-text);
            background: rgba(255, 255, 255, 0.25);
            color: var(--ink-text);
            font-size: 16px;
            font-family: 'EB Garamond', serif;
            outline: none;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .input-field:focus {
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--emblem-red);
            border: 2px solid var(--ink-text);
            color: white;
            font-family: 'IM Fell English SC', serif;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink-text);
            transition: all 0.1s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink-text);
            background: #6a0000;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            color: var(--ink-text);
            cursor: pointer;
            font-family: 'EB Garamond', serif;
            font-size: 1rem;
            font-weight: 600;
        }
        .link:hover { text-decoration: underline; color: var(--emblem-red); }

        .ink-swell {
            position: fixed;
            top: 50%; left: 50%; width: 100vw; height: 100vw;
            background: var(--ink-text);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 1000;
            pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .ink-swell.active { transform: translate(-50%, -50%) scale(3); }

        .auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .message-box {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--bg-parchment);
            color: var(--ink-text);
            border: 5px double var(--ink-text);
            z-index: 200;
            padding: 20px;
            box-shadow: 10px 10px 0 var(--shadow-dark);
            max-width: 80%;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .message-box.visible { visibility: visible; opacity: 1; }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 10px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
    
</head>

<body>
    <div id="ink-swell" class="ink-swell"></div>

    <div id="message-box" class="message-box rounded-md">
        <p id="message-content" class="text-lg"></p>
        <button onclick="closeMessageBox()" class="mt-4 p-2 bg-white font-title border border-gray-800 hover:bg-gray-200">Close Scroll</button>
    </div>

    <nav class="nav-parchment w-full shadow-lg relative z-20">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex items-center space-x-6">
                <div class="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center font-title text-xl nav-link text-white" 
                     style="background-color: var(--emblem-red); border-color: var(--ink-text);" 
                     onclick="handleNavigation('/')">
                    N
                </div>
                <span class="text-2xl font-bold font-title nav-link" onclick="handleNavigation('/')">The Nook</span>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="panel" id="login-box">
            <h2 class="font-title">Login</h2>
            
            <form id="login-form">
                <input class="input-field" id="login-email" type="email" placeholder="Email" required>
                <input class="input-field" id="login-password" type="password" placeholder="Password" required>
                
                <div class="link text-sm mb-4 text-right" style="margin-top: -10px;" onclick="showMessageBox('The archive keeper is currently searching for the password recovery scrolls.')">Forgot password?</div>
                
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="link" onclick="showSignup()">Don't have an account? Sign Up</div>
            
            <div id="login-error" class="error-message hidden"></div>
        </div>

        <div class="panel" id="signup-box" style="display:none;">
            <h2 class="font-title">Create Account</h2>
            
            <form id="register-form">
                <input class="input-field" id="reg-name" placeholder="Full Name" required>
                <input class="input-field" id="reg-alias" placeholder="Display Name" required>
                <input class="input-field" id="reg-email" type="email" placeholder="Email" required>
                <input class="input-field" id="reg-password" type="password" placeholder="Password" required>
                <input class="input-field" id="reg-confirm" type="password" placeholder="Confirm Password" required>
                
                <button type="submit" class="btn">Create Account</button>
            </form>
            <div class="link" onclick="showLogin()">Already have an account? Login</div>
            
            <div id="register-error" class="error-message hidden"></div>
        </div>
    </div>

    <script type="module">
        import Auth from "./auth.js";
        window.Auth = Auth;

        window.showMessageBox = (message) => {
            document.getElementById('message-content').innerText = message;
            document.getElementById('message-box').classList.add('visible');
        };

        window.closeMessageBox = () => {
            document.getElementById('message-box').classList.remove('visible');
        };

        window.showSignup = () => {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("signup-box").style.display = "block";
            window.scrollTo(0, 0); 
        }

        window.showLogin = () => {
            document.getElementById("signup-box").style.display = "none";
            document.getElementById("login-box").style.display = "block";
            window.scrollTo(0, 0); 
        }

        window.handleNavigation = (path, event = { clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 }) => {
            const swell = document.getElementById('ink-swell');
            swell.style.left = `${event.clientX}px`;
            swell.style.top = `${event.clientY}px`;
            swell.classList.add('active');

            setTimeout(() => {
                if (path === '/') {
                    window.location.href = 'nook_homepage_final.html';
                } else {
                    window.showMessageBox(`Mapped to: ${path}`);
                    setTimeout(() => { swell.classList.remove('active'); }, 100);
                }
            }, 600);
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('login-error');
            errorDiv.classList.add('hidden');
            
            try {
                const response = await Auth.apiCall('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-password').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    Auth.loginSuccess(data.token);
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        };

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('register-error');
            errorDiv.classList.add('hidden');
            
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            
            if (password !== confirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            try {
                const response = await Auth.apiCall('/api/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: document.getElementById('reg-email').value,
                        password: password,
                        full_name: document.getElementById('reg-name').value,
                        alias: document.getElementById('reg-alias').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    Auth.loginSuccess(data.token);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
