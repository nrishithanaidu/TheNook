<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Nook – Vintage Record Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        :root {
            --wood-medium: #5d3a1a; 
            --wood-dark: #2e1a0b; 
            --neon-orange: #ff8c00;
            --cream: #fdf5e6; 
            --bakelite: #1a1a1a; 
            --brass: #c5a059; 
            --error: #8b0000;
            --nav-bg: #1c0f12;
            --emblem-red: #8B0000;
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), repeating-linear-gradient(90deg, #3b2316 0px, #3b2316 100px, #442a1d 101px, #442a1d 200px);
            color: var(--cream); 
            font-family: 'Crimson Text', serif; 
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- THE NOOK NAVIGATION BAR --- */
        .nav-record-shop {
            background-color: var(--wood-dark);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 1100;
            padding: 0.5rem 0;
            border-bottom: 2px solid var(--brass);
        }

        .font-title { font-family: 'IM Fell English SC', serif; }
        .font-bebas { font-family: 'Bebas Neue', sans-serif; }

        .nav-link { cursor: pointer; transition: all 0.3s ease; }
        .nav-link:hover {
            color: var(--neon-orange);
            text-shadow: 0 0 10px rgba(255, 140, 0, 0.6);
        }

        .status-badge { 
            font-size: 0.65rem; padding: 3px 10px; border-radius: 4px; text-transform: uppercase; 
            font-weight: bold; background: #333; color: #aaa; letter-spacing: 1px;
        }
        .status-online { color: #50ff50; text-shadow: 0 0 5px #50ff50; }

        /* --- SHOP HEADER --- */
        .shop-header { 
            background: #111; 
            padding: 40px; 
            border: 8px solid var(--bakelite); 
            outline: 2px solid var(--brass); 
            text-align: center; 
            margin: 40px auto 30px;
            max-width: 900px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .shop-title { font-family: 'Bebas Neue'; font-size: clamp(40px, 6vw, 65px); letter-spacing: 12px; color: white; text-shadow: 0 0 15px var(--neon-orange); }
        .shop-subtitle { font-family: 'Crimson Text'; font-style: italic; color: var(--brass); letter-spacing: 2px; font-size: 14px; margin-top: 5px; opacity: 0.8; }

        /* --- TOOLS CONTAINER --- */
        .shop-tools-container {
            max-width: 700px;
            margin: 0 auto 60px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            padding: 10px;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--brass);
            border-radius: 4px;
            position: relative;
        }

        .search-bar input {
            background: transparent;
            border: none;
            padding: 10px 15px;
            font-family: 'Bebas Neue';
            font-size: 1.5rem;
            color: white;
            width: 100%;
            outline: none;
            letter-spacing: 2px;
        }

        /* --- SEARCH RESULTS AREA --- */
        .search-results-area {
            position: absolute;
            top: 100%;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            border: 2px solid var(--brass);
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 500;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            padding: 15px;
        }
        .search-results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .search-result-item {
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid transparent;
            background: #222;
        }
        .search-result-item:hover {
            background: #333;
            border-color: var(--brass);
        }
        .search-result-item img { width: 100%; height: 140px; object-fit: cover; border-radius: 2px; margin-bottom: 5px; border: 2px solid #000; }
        .search-result-item p { font-size: 12px; font-weight: bold; font-family: 'Bebas Neue'; color: var(--cream); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 1px; }

        .actions-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 50;
        }

        /* PREMIUM BUTTONS */
        .btn-brass, .btn-gold { 
            background: var(--brass); border: none; color: var(--wood-dark); 
            padding: 12px 35px; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; 
            box-shadow: 4px 4px 0px var(--wood-dark); transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn-brass:hover, .btn-gold:hover { filter: brightness(1.1); transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--wood-dark); }

        .btn-danger { background: var(--error); color: white; border: none; padding: 12px 30px; font-family: 'Bebas Neue'; cursor: pointer; letter-spacing: 1px; }
        .btn-danger:hover { filter: brightness(1.2); }

        /* --- CRATE ARCHITECTURE --- */
        .section { margin-top: 60px; position: relative; }
        .section-banner { 
            font-family: 'Bebas Neue'; font-size: 1.8rem; background: var(--bakelite); 
            padding: 8px 35px; border: 2px solid var(--brass); border-bottom: none; 
            display: inline-block; margin-left: 40px; letter-spacing: 3px; color: var(--brass);
        }

        .shelf-wrapper {
            position: relative;
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        .vinyl-crate { 
            background: linear-gradient(to bottom, #4a2c1d, #2e1a0b); 
            border: 4px solid var(--wood-dark); 
            border-top: 8px solid var(--wood-medium); 
            padding: 20px 10px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            width: 100%;
        }

        .vinyl-row { 
            display: flex; 
            gap: 15px; 
            overflow-x: auto; 
            padding: 10px 40px; 
            scroll-behavior: smooth;
        }
        .vinyl-row::-webkit-scrollbar { display: none; }

        /* STATIONARY CIRCULAR SCROLL BUTTONS */
        .scroll-btn {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            height: 40px; width: 40px; background: transparent; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; opacity: 0; transition: opacity 0.3s ease;
        }
        .scroll-btn span {
            background: var(--brass); width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid var(--wood-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: var(--wood-dark); font-weight: bold; font-size: 1.1rem;
        }
        .shelf-wrapper:hover .scroll-btn { opacity: 1; }
        .scroll-btn.left { left: 10px; }
        .scroll-btn.right { right: 10px; }

        /* RECORD CARD */
        .record-card { 
            flex: 0 0 170px; 
            background: #fff; 
            padding: 10px; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 2px 5px 15px rgba(0,0,0,0.4); 
            border: 1px solid #ddd; 
            position: relative; 
        }
        .record-card:hover { transform: translateY(-15px) rotate(1deg); z-index: 10; box-shadow: 10px 20px 40px rgba(0,0,0,0.5); }
        .record-visual { width: 100%; aspect-ratio: 1/1; background: #222; overflow: hidden; border: 2px solid #111; }
        .record-visual img { width: 100%; height: 100%; object-fit: cover; }
        .record-title { font-family: 'Bebas Neue'; font-size: 15px; color: #111; margin: 10px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.5px; }
        .record-artist { font-size: 12px; color: #555; font-style: italic; }

        /* LP CARRYING CASE (COLLECTION) */
        .collection-case {
            flex: 0 0 190px; 
            height: 220px; 
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            border: 4px solid #111;
            border-radius: 6px 15px 15px 6px; 
            cursor: pointer; 
            position: relative; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border-left: 12px solid #000;
        }
        .collection-case::before {
            content: ''; position: absolute; top: 0; right: 0; width: 30px; height: 30px;
            background: radial-gradient(circle at top right, var(--brass) 10%, transparent 70%);
            border-radius: 0 11px 0 0; opacity: 0.6;
        }
        .collection-case:hover { 
            transform: translateY(-10px) rotate(-1deg); 
            box-shadow: 15px 25px 50px rgba(0,0,0,0.8); 
            border-color: var(--brass);
        }
        .case-plaque {
            background: var(--gold-gradient);
            padding: 10px 15px; font-family: 'Bebas Neue', sans-serif;
            font-size: 13px; font-weight: 800; color: #1a0508;
            text-transform: uppercase; text-align: center; border: 1px solid #8a6d3b; border-radius: 2px;
            max-width: 85%; word-break: break-word;
            box-shadow: 0 8px 15px rgba(0,0,0,0.8), inset 0 1px 1px white;
            z-index: 5; letter-spacing: 2px;
        }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 4000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--cream); color: var(--wood-dark); width: 95%; max-width: 700px; padding: 45px; border: 12px solid var(--bakelite); outline: 2px solid var(--brass); max-height: 90vh; overflow-y: auto; position: relative; }
        .modal h2, .modal h3 { font-family: 'Bebas Neue'; letter-spacing: 3px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--wood-medium); font-size: 12px; text-transform: uppercase; font-family: 'Bebas Neue'; font-weight: bold; letter-spacing: 1px; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 12px; border: 2px solid #ddd; font-family: 'Crimson Text'; font-size: 16px; border-radius: 4px; }
        
        /* Tracklist Styling - Rating Absolute Right */
        .track-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px; 
            border-bottom: 1px solid #ddd; 
            cursor: pointer; 
            transition: 0.2s; 
            background: rgba(0,0,0,0.02); 
        }
        .track-item:hover { background: rgba(0,0,0,0.05); color: var(--wood-medium); }
        .track-item .stars { margin-left: auto; white-space: nowrap; color: var(--brass); }

        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 32px; cursor: pointer; font-family: 'Bebas Neue'; color: var(--wood-dark); }
        
        .reel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 30px; justify-items: center; padding-top: 20px; }

        .remove-icon {
            position: absolute; top: -10px; right: -10px; background: var(--error); color: white;
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; border: 2px solid white; z-index: 101; opacity: 0; transition: 0.2s;
        }
        .case-item-wrapper { position: relative; width: 160px; }
        .case-item-wrapper:hover .remove-icon { opacity: 1; }

        .selection-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); 
            gap: 20px; max-height: 400px; overflow-y: auto; padding: 20px; background: #fff; border: 2px solid var(--bakelite); border-radius: 4px;
        }
        .selection-record { cursor: pointer; text-align: center; transition: 0.3s; padding: 8px; border: 1px solid transparent; }
        .selection-record:hover { background: rgba(0,0,0,0.05); border-color: var(--brass); transform: scale(1.05); }
        .selection-record img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border: 2px solid #000; }
        .selection-record p { font-family: 'Bebas Neue'; font-size: 12px; color: #111; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Assign Section Styles */
        .assign-container { margin: 20px auto; padding: 20px; background: rgba(0,0,0,0.03); border: 2px dashed var(--brass); border-radius: 8px; max-width: 500px; }
        .song-picker-list { max-height: 200px; overflow-y: auto; background: white; border: 1px solid #ddd; padding: 10px; margin: 15px 0; border-radius: 4px; text-align: left; }
        .song-checkbox-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; color: var(--wood-dark); font-weight: bold; font-family: 'Bebas Neue'; letter-spacing: 0.5px; }
        .song-checkbox-item:last-child { border-bottom: none; }
        .song-checkbox-item input { width: auto; margin-bottom: 0; cursor: pointer; }

        /* Track Card Style in Archive */
        .track-card {
            flex: 0 0 160px; width: 160px; background: #fff; padding: 10px; border-radius: 8px; border: 2px solid var(--bakelite); box-shadow: 4px 4px 10px rgba(0,0,0,0.2); text-align: center;
        }
        .track-card .vinyl-mini { width: 80px; height: 80px; margin: 0 auto 10px; background: radial-gradient(circle, #333 30%, #111 70%); border-radius: 50%; border: 4px solid #000; display: flex; align-items: center; justify-content: center; position: relative; }
        .track-card .vinyl-mini::after { content: ''; width: 20px; height: 20px; background: #fff; border-radius: 50%; }
        .track-card b { font-family: 'Bebas Neue'; color: var(--wood-dark); font-size: 14px; display: block; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .track-card small { font-style: italic; color: #666; font-size: 11px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- THE NOOK NAVIGATION BAR -->
    <nav class="nav-record-shop w-full">
        <div class="flex items-center justify-between px-10 mx-auto max-w-[1400px]">
            <div class="flex items-center space-x-6">
                <div class="w-12 h-12 rounded-full border-2 border-brass flex items-center justify-center font-title text-2xl nav-link text-white" 
                     style="background-color: var(--emblem-red); border-color: var(--brass);" 
                     onclick="window.location.href='nook_homepage_final.html'">N</div>
                <span class="logo nav-link font-title text-3xl font-bold" style="color: white; text-shadow: none; letter-spacing: 0;" onclick="window.location.href='nook_homepage_final.html'">The Nook</span>
                <div id="connectionStatus" class="status-badge ml-4">Syncing Vault...</div>
            </div>

            <div class="flex items-center text-lg font-title text-white">
                <span class="nav-link flex items-center space-x-3 font-bold">
                    <svg class="w-7 h-7 border-2 border-current rounded-full p-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span>Guest</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="page-wrap">
        <header class="shop-header">
            <div class="shop-title">VINYL & VIBES</div>
            <div class="shop-subtitle">ESTABLISHED 1959 • THE LP COLLECTION</div>
        </header>

        <!-- TOOLS CONTAINER -->
        <div class="shop-tools-container">
            <div class="search-bar">
                <input type="text" id="shopSearch" placeholder="SEARCH FOR A MASTER RECORD..." oninput="triggerFilter()">
                <!-- SEARCH RESULTS AREA -->
                <div id="search-results-area" class="search-results-area hidden">
                    <div id="search-results-grid" class="search-results-grid"></div>
                </div>
            </div>

            <div class="actions-bar">
                <button onclick="openCollectionModal()" class="btn-brass">+ Forge List</button>
                <button onclick="openAddModal()" class="btn-brass">+ Add Vinyl LP</button>
            </div>
        </div>

        <section class="section">
            <div class="section-banner">ON THE TURNTABLE</div>
            <div class="shelf-wrapper">
                <button class="scroll-btn left" onclick="scrollCrate('now-playing', -400)"><span>&#10094;</span></button>
                <div class="vinyl-crate"><div class="vinyl-row" id="now-playing"></div></div>
                <button class="scroll-btn right" onclick="scrollCrate('now-playing', 400)"><span>&#10095;</span></button>
            </div>
        </section>

        <section class="section">
            <div class="section-banner">IN THE CRATE</div>
            <div class="shelf-wrapper">
                <button class="scroll-btn left" onclick="scrollCrate('queued', -400)"><span>&#10094;</span></button>
                <div class="vinyl-crate"><div class="vinyl-row" id="queued"></div></div>
                <button class="scroll-btn right" onclick="scrollCrate('queued', 400)"><span>&#10095;</span></button>
            </div>
        </section>

        <section class="section">
            <div class="section-banner">ARCHIVED SESSIONS</div>
            <div class="shelf-wrapper">
                <button class="scroll-btn left" onclick="scrollCrate('finished', -400)"><span>&#10094;</span></button>
                <div class="vinyl-crate"><div class="vinyl-row" id="finished"></div></div>
                <button class="scroll-btn right" onclick="scrollCrate('finished', 400)"><span>&#10095;</span></button>
            </div>
        </section>

        <section class="section" id="collections-section">
            <div class="section-banner">ARCHIVE CASES</div>
            <div class="shelf-wrapper">
                <button class="scroll-btn left" onclick="scrollCrate('collections-shelf', -400)"><span>&#10094;</span></button>
                <div class="vinyl-crate"><div class="vinyl-row" id="collections-shelf"></div></div>
                <button class="scroll-btn right" onclick="scrollCrate('collections-shelf', 400)"><span>&#10095;</span></button>
            </div>
        </section>

        <div class="text-center mt-20 opacity-30 font-bebas text-xs tracking-widest uppercase pb-20">End of Inventory</div>
    </div>

    <!-- GRAND COLLECTION VIEW -->
    <div class="modal-overlay" id="journalModal">
        <div class="modal" style="max-width: 1000px;">
            <button class="modal-close" onclick="closeJournal()">&times;</button>
            <div class="text-center border-b-4 border-bakelite pb-8 mb-8">
                <h2 id="journalTitle" style="font-size: 3.5rem;">Collection</h2>
                <div class="flex justify-center gap-6 mt-6">
                    <button onclick="openSelectionModal()" class="btn-brass">+ Add Vinyl</button>
                    <button onclick="renameCollectionPrompt()" class="btn-brass">Rename Case</button>
                    <button class="btn-danger" onclick="deleteCollectionPrompt()">Delete Case</button>
                </div>
            </div>
            <div class="reel-grid" id="journalGrid"></div>
        </div>
    </div>

    <!-- VINYL SELECTION MODAL (Pick Album -> Pick Songs) -->
    <div class="modal-overlay" id="selectionModal" style="z-index: 4500;">
        <div class="modal" style="max-width: 750px;">
            <button class="modal-close" onclick="closeSelectionModal()">&times;</button>
            <h3 id="selectionHeader" style="font-size: 2rem; text-align: center;">Select Master LP</h3>
            <p id="selectionSub" style="text-align: center; color: var(--wood-medium); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px;">Browse your general inventory</p>
            
            <div class="selection-grid" id="selectionGrid"></div>
            
            <div id="selectionSongPicker" class="hidden">
                <div id="selectionSongPickerGrid" class="song-picker-list"></div>
                <div class="flex gap-4">
                    <button class="btn-brass flex-1" onclick="confirmSelectionAdd()">ADD SELECTED TRACKS</button>
                    <button class="btn-gold flex-1" style="background:#666; color:white; box-shadow:none;" onclick="cancelSelectionSongPicker()">BACK TO ALBUMS</button>
                </div>
            </div>
            
            <div id="selectionActions" class="text-center mt-10">
                <button class="btn-gold" style="background:#333; color:white; box-shadow:none;" onclick="closeSelectionModal()">Cancel Search</button>
            </div>
        </div>
    </div>

    <!-- ADD LP MODAL -->
    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <button class="modal-close" onclick="closeAddModal()">&times;</button>
            <h2 id="modalTitle" style="text-align: center; margin-bottom: 20px;">Catalog Master LP</h2>
            <div id="magicSection">
                <div class="form-group">
                    <label>Magic Search (Sync with iTunes)</label>
                    <div class="flex gap-2">
                        <input type="text" id="magicSearch" placeholder="Artist or Album title...">
                        <button class="btn-gold" style="padding: 10px 20px;" onclick="searchAlbums()">Fetch</button>
                    </div>
                </div>
                <div id="search-results" class="search-results hidden"></div>
            </div>
            <hr style="margin: 25px 0; border-color: #ddd;">
            <div class="form-group"><label>Album Title</label><input type="text" id="albumIn"></div>
            <div class="form-group"><label>Artist</label><input type="text" id="artistIn"></div>
            <div class="grid grid-cols-2 gap-4">
                <div class="form-group"><label>Overall LP Mood</label><input type="text" id="moodIn"></div>
                <div class="form-group"><label>Crate Placement</label><select id="statusIn"><option value="now-playing">On the Turntable</option><option value="queued">In the Crate</option><option value="finished">Archived</option></select></div>
            </div>
            <div class="form-group"><label>Sleeve Art URL</label><input type="text" id="imgIn"></div>
            <div class="form-group">
                <label>Tracklist Editor</label>
                <div id="trackEditorList"></div>
                <button class="btn-gold" style="padding: 8px 20px; font-size: 0.9rem; margin-top: 10px;" onclick="addTrackInput()">+ Add Track</button>
            </div>
            <button class="btn-gold" style="width: 100%; margin-top: 30px;" id="saveBtn">FILE TO CABINET</button>
        </div>
    </div>

    <!-- DETAILS VIEW MODAL -->
    <div class="modal-overlay" id="detailsModal">
        <div class="modal">
            <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
            <div style="text-align: center;">
                <img id="vImg" style="width: 180px; height: 180px; border: 8px solid var(--bakelite); margin-bottom: 20px;" src="" alt="Cover">
                <h2 id="vAlbumTitle" style="font-family: 'Bebas Neue'; margin: 0; font-size: 2.5rem;"></h2>
                <p id="vArtist" style="font-style: italic; opacity: 0.7; font-size: 1.2rem; margin-bottom: 20px;"></p>
                
                <!-- ASSIGN TO LIST SECTION -->
                <div class="assign-container">
                    <label style="font-family: Bebas Neue; font-size: 14px; color: var(--wood-medium);">Assign LP to Archive Case</label>
                    <select id="detailsCollectionSelect" style="margin: 10px 0;" onchange="handleCollectionSelect()">
                        <option value="">Select LP Case...</option>
                    </select>
                    
                    <div id="songPickerSection" class="hidden">
                        <label style="font-family: Bebas Neue; font-size: 11px; margin-top: 10px; display: block;">Select Tracks to Include in Archive:</label>
                        <div id="songPickerGrid" class="song-picker-list"></div>
                    </div>
                    
                    <button class="btn-brass" style="width: 100%; margin-top: 10px; padding: 10px;" onclick="addCurrentToCollection()">CONFIRM ASSIGNMENT</button>
                </div>
            </div>
            
            <div style="background: #eee; padding: 15px; margin: 25px 0; border-radius: 4px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-family: 'Bebas Neue';">Vibe: <span id="vMood" style="color: var(--wood-medium);"></span></span>
                    <span id="vRating" style="color: var(--brass); font-size: 1.5rem;"></span>
                </div>
            </div>

            <h3 style="font-family: 'Bebas Neue'; border-bottom: 2px solid var(--bakelite); padding-bottom: 5px; margin-bottom: 15px;">Tracklist (Click for Specs)</h3>
            <div id="vTracklist"></div>

            <div style="display: flex; gap: 15px; margin-top: 40px;">
                <button class="btn-gold" style="flex: 1" onclick="initiateEdit()">EDIT MASTER</button>
                <button class="btn-danger" style="flex: 1" onclick="deleteAlbum()">SCRAP RECORD</button>
            </div>
        </div>
    </div>

    <!-- NEW COLLECTION MODAL -->
    <div class="modal-overlay" id="collectionModal">
      <div class="modal" style="max-width: 450px;">
        <button class="modal-close" onclick="closeCollectionModal()">&times;</button>
        <h2 style="text-align: center; margin-bottom: 20px;">New Archive Case</h2>
        <div class="form-group">
            <label>Case Title</label>
            <input id="collectionTitle" placeholder="e.g. Jazz Favorites, 70s Rock...">
        </div>
        <button class="btn-gold" style="width:100%; margin-top: 10px;" onclick="createCollection()">Forge Case</button>
      </div>
    </div>

<script>
    let albums = [];
    let customCollections = [];
    let activeId = null;
    let activeCaseId = null;
    let selectedAlbumForArchive = null;
    const API_BASE = "http://127.0.0.1:5000/api/albums";
    const COLL_URL = "http://127.0.0.1:5000/api/collections";

    function scrollCrate(id, amount) {
        const row = document.getElementById(id);
        if(row) row.scrollLeft += amount;
    }

    async function loadData() {
        try {
            const [albRes, collRes] = await Promise.all([
                fetch(API_BASE),
                fetch(`${COLL_URL}?media_type=album`)
            ]);
            albums = await albRes.json();
            customCollections = await collRes.json();
            updateStatus(true);
            updateDropdowns();
            render();
            if (activeCaseId) openJournal(activeCaseId);
        } catch (e) { updateStatus(false); }
    }

    function triggerFilter() {
        const q = document.getElementById('shopSearch').value.toLowerCase().trim();
        const area = document.getElementById('search-results-area');
        const grid = document.getElementById('search-results-grid');
        if (q === "") { area.classList.add('hidden'); return; }
        const filtered = albums.filter(a => a.album_name.toLowerCase().includes(q) || a.artist.toLowerCase().includes(q));
        grid.innerHTML = "";
        if (filtered.length > 0) {
            area.classList.remove('hidden');
            filtered.forEach(a => {
                const item = document.createElement('div');
                item.className = 'search-result-item';
                item.innerHTML = `<img src="${a.img || 'https://via.placeholder.com/154/222'}"><p>${a.album_name}</p>`;
                item.onclick = () => { area.classList.add('hidden'); openDetails(a); };
                grid.appendChild(item);
            });
        } else {
            grid.innerHTML = "<p style='color:#999; text-align:center; width:100%; padding:20px; font-family:Bebas Neue;'>No records found in inventory.</p>";
            area.classList.remove('hidden');
        }
    }

    function render() {
        ['now-playing', 'queued', 'finished', 'collections-shelf'].forEach(s => {
            const el = document.getElementById(s);
            if(el) el.innerHTML = "";
        });

        customCollections.forEach(case_lp => {
            const folder = document.createElement('div');
            folder.className = 'collection-case';
            folder.innerHTML = `<div class="case-plaque">${case_lp.name}</div>`;
            folder.onclick = () => openJournal(case_lp.id);
            const shelf = document.getElementById('collections-shelf');
            if(shelf) shelf.appendChild(folder);
        });

        albums.forEach(a => {
            const card = createRecordEl(a, false);
            const targetId = a.status || 'queued';
            const row = document.getElementById(targetId);
            if(row) row.appendChild(card);
        });
    }

    function createRecordEl(a, isCaseView = false, trackName = null) {
        if (isCaseView && trackName) {
            const wrap = document.createElement('div');
            wrap.className = 'case-item-wrapper';
            
            const card = document.createElement('div');
            card.className = 'track-card';
            card.onclick = () => openDetails(a);
            
            card.innerHTML = `
                <div class="vinyl-mini"></div>
                <b>${trackName}</b>
                <small>${a.artist}</small>
            `;
            
            const del = document.createElement('div');
            del.className = 'remove-icon';
            del.innerHTML = '&times;';
            del.onclick = async (e) => {
                e.stopPropagation();
                // To remove a specific track from the list, we need to match the ID and the specific track note
                const caseObj = customCollections.find(c => c.id === activeCaseId);
                const itemToRemove = caseObj.items.find(i => i.id === a.id && i.note === `Track: ${trackName}`);
                if (itemToRemove) {
                    await fetch(`${COLL_URL}/${activeCaseId}/items/${a.id}`, { method: 'DELETE' }); // Note: Simplified, backend usually needs item linked ID
                    loadData();
                } else {
                    // Fallback to standard remove if no specific note found
                    await fetch(`${COLL_URL}/${activeCaseId}/items/${a.id}`, { method: 'DELETE' });
                    loadData();
                }
            };
            
            wrap.appendChild(card);
            wrap.appendChild(del);
            return wrap;
        }

        const card = document.createElement('div');
        card.className = 'record-card';
        card.innerHTML = `<div class="record-visual"><img src="${a.img || 'https://via.placeholder.com/154/222'}"></div><div class="record-title">${a.album_name}</div><div class="record-artist">${a.artist}</div>`;
        card.onclick = () => openDetails(a);
        return card;
    }

    function openJournal(id) {
        activeCaseId = id;
        const case_lp = customCollections.find(c => c.id === id);
        if(!case_lp) return;
        document.getElementById('journalTitle').innerText = case_lp.name;
        const grid = document.getElementById('journalGrid');
        grid.innerHTML = "";
        
        if(!case_lp.items || case_lp.items.length === 0) {
            grid.innerHTML = '<p style="opacity:0.5; grid-column:1/-1; text-align:center; padding: 40px; font-family:Crimson Text;">This archive case is currently empty.</p>';
        } else {
            case_lp.items.forEach(item => {
                const fullAlbum = albums.find(inv => inv.id === item.id);
                if (fullAlbum) {
                    const trackName = item.note && item.note.startsWith("Track: ") ? item.note.replace("Track: ", "") : null;
                    grid.appendChild(createRecordEl(fullAlbum, true, trackName));
                }
            });
        }
        document.getElementById('journalModal').classList.add('show');
    }

    function closeJournal() { document.getElementById('journalModal').classList.remove('show'); activeCaseId = null; }

    function openSelectionModal() {
        document.getElementById('selectionGrid').classList.remove('hidden');
        document.getElementById('selectionSongPicker').classList.add('hidden');
        document.getElementById('selectionHeader').innerText = "Select Master LP";
        document.getElementById('selectionSub').innerText = "Browse your general inventory";
        document.getElementById('selectionActions').classList.remove('hidden');
        
        const grid = document.getElementById('selectionGrid');
        grid.innerHTML = "";
        
        albums.forEach(a => {
            const item = document.createElement('div');
            item.className = 'selection-record';
            item.innerHTML = `<img src="${a.img || 'https://via.placeholder.com/154/222'}"><p>${a.album_name}</p>`;
            item.onclick = () => openSelectionSongPicker(a);
            grid.appendChild(item);
        });
        document.getElementById('selectionModal').classList.add('show');
    }

    function openSelectionSongPicker(album) {
        selectedAlbumForArchive = album;
        document.getElementById('selectionGrid').classList.add('hidden');
        document.getElementById('selectionActions').classList.add('hidden');
        document.getElementById('selectionSongPicker').classList.remove('hidden');
        document.getElementById('selectionHeader').innerText = album.album_name;
        document.getElementById('selectionSub').innerText = "Pick Specific Tracks to Archive";

        const pickerGrid = document.getElementById('selectionSongPickerGrid');
        pickerGrid.innerHTML = "";
        
        album.songs.forEach(s => {
            const div = document.createElement('div');
            div.className = 'song-checkbox-item';
            div.innerHTML = `<input type="checkbox" class="sel-song-check" value="${s.id}"> <span>${s.song_title}</span>`;
            pickerGrid.appendChild(div);
        });
    }

    function cancelSelectionSongPicker() {
        selectedAlbumForArchive = null;
        openSelectionModal();
    }

    async function confirmSelectionAdd() {
        const checks = document.querySelectorAll('.sel-song-check:checked');
        if (checks.length === 0) return alert("Select at least one track!");

        for (let cb of checks) {
            await fetch(`${COLL_URL}/${activeCaseId}/items`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ item_id: cb.value, note: `Track: ${cb.value}` })
            });
        }
        
        closeSelectionModal(); loadData();
    }

    function closeSelectionModal() { document.getElementById('selectionModal').classList.remove('show'); }

    async function addCurrentToCollection() {
        const target = document.getElementById('detailsCollectionSelect').value;
        if(!target) return alert("Select a case first!");
        
        const checks = document.querySelectorAll('.song-picker-checkbox:checked');
        if (checks.length === 0) return alert("Pick at least one track to assign.");

        for (let cb of checks) {
            await fetch(`${COLL_URL}/${target}/items`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ item_id: activeId, note: `Track: ${cb.value}` })
            });
        }
        
        alert("LP Filed to Case!"); loadData();
    }

    function handleCollectionSelect() {
        const val = document.getElementById('detailsCollectionSelect').value;
        const picker = document.getElementById('songPickerSection');
        if(val) picker.classList.remove('hidden');
        else picker.classList.add('hidden');
    }

    function updateDropdowns() {
        const select = document.getElementById('detailsCollectionSelect');
        if(!select) return;
        select.innerHTML = '<option value="">Select LP Case...</option>';
        customCollections.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id; opt.textContent = c.name;
            select.appendChild(opt);
        });
    }

    async function createCollection() {
        const name = document.getElementById('collectionTitle').value.trim();
        if(!name) return;
        await fetch(COLL_URL, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, media_type: 'album' })
        });
        closeCollectionModal(); loadData();
    }
    function openCollectionModal() { document.getElementById('collectionModal').classList.add('show'); }
    function closeCollectionModal() { document.getElementById('collectionModal').classList.remove('show'); }

    function openDetails(a) {
        activeId = a.id;
        document.getElementById('vAlbumTitle').textContent = a.album_name;
        document.getElementById('vArtist').textContent = a.artist;
        document.getElementById('vMood').textContent = a.mood || "Standard";
        document.getElementById('vRating').innerHTML = "★".repeat(a.rating || 0);
        document.getElementById('vImg').src = a.img || 'https://via.placeholder.com/250/222';
        
        const trackList = document.getElementById('vTracklist');
        const songPicker = document.getElementById('songPickerGrid');
        trackList.innerHTML = "";
        songPicker.innerHTML = "";
        
        document.getElementById('detailsCollectionSelect').value = "";
        document.getElementById('songPickerSection').classList.add('hidden');

        a.songs.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'track-item';
            row.innerHTML = `<span><span style="font-family:Bebas Neue; margin-right:15px; opacity:0.5;">${(i+1).toString().padStart(2,'0')}</span>${s.song_title}</span><span class="stars">${"★".repeat(s.rating || 0)}</span>`;
            trackList.appendChild(row);
            
            const check = document.createElement('div');
            check.className = 'song-checkbox-item';
            check.innerHTML = `<input type="checkbox" class="song-picker-checkbox" value="${s.song_title}"> <span>${s.song_title}</span>`;
            songPicker.appendChild(check);
        });
        document.getElementById('detailsModal').classList.add('show');
    }

    function addTrackInput(title = "", mood = "", rating = 0) {
        const container = document.getElementById('trackEditorList');
        const div = document.createElement('div');
        div.className = 'track-input-block';
        div.style = "background:#eee; padding:10px; margin-bottom:10px; border-radius:4px;";
        div.innerHTML = `<div class="flex gap-2 mb-2"><input type="text" placeholder="Track Title" class="t-title" value="${title}" style="flex:2"><input type="number" placeholder="Rating" class="t-rating" min="0" max="5" value="${rating}" style="flex:1"></div><div class="flex gap-2"><input type="text" placeholder="Mood" class="t-mood" value="${mood}" style="flex:2"><button class="btn-danger" style="padding: 5px 15px; flex:0.5" onclick="this.parentElement.parentElement.remove()">×</button></div>`;
        container.appendChild(div);
    }

    async function searchAlbums() {
        const q = document.getElementById('magicSearch').value;
        if(!q) return;
        const btn = document.querySelector('#magicSection button');
        btn.innerText = "Searching..."; btn.disabled = true;
        try {
            const res = await fetch(`http://127.0.0.1:5000/api/magic-music-search?q=${encodeURIComponent(q)}`);
            const data = await res.json();
            const results = document.getElementById('search-results');
            results.innerHTML = ""; results.classList.remove('hidden');
            data.results.forEach(item => {
                const div = document.createElement('div'); div.className = 'search-item';
                div.innerHTML = `<img src="${item.artwork}" width="50" style="border:1px solid #000"><div><b style="font-family:Bebas Neue;">${item.album_name}</b><br><small>${item.artist}</small></div>`;
                div.onclick = () => {
                    document.getElementById('albumIn').value = item.album_name;
                    document.getElementById('artistIn').value = item.artist;
                    document.getElementById('imgIn').value = item.artwork;
                    document.getElementById('trackEditorList').innerHTML = "";
                    item.songs.forEach(s => addTrackInput(s.song_title));
                    results.classList.add('hidden');
                };
                results.appendChild(div);
            });
        } finally { btn.innerText = "Fetch"; btn.disabled = false; }
    }

    document.getElementById('saveBtn').onclick = async () => {
        const songs = [];
        document.querySelectorAll('.track-input-block').forEach(b => {
            songs.push({ song_title: b.querySelector('.t-title').value, mood: b.querySelector('.t-mood').value, rating: parseInt(b.querySelector('.t-rating').value) || 0, notes: "" });
        });
        const payload = { album_name: document.getElementById('albumIn').value, artist: document.getElementById('artistIn').value, mood: document.getElementById('moodIn').value, img: document.getElementById('imgIn').value, status: document.getElementById('statusIn').value, songs: songs };
        const method = activeId ? 'PATCH' : 'POST';
        const url = activeId ? `${API_BASE}/${activeId}` : API_BASE;
        await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        closeAddModal(); loadData();
    };

    function openAddModal() { 
        activeId = null;
        document.getElementById('albumIn').value = "";
        document.getElementById('artistIn').value = "";
        document.getElementById('trackEditorList').innerHTML = "";
        document.getElementById('addModal').classList.add('show'); 
    }
    function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
    function closeDetailsModal() { document.getElementById('detailsModal').classList.remove('show'); }
    function updateStatus(on) { 
        const el = document.getElementById('connectionStatus');
        if(el) {
            el.textContent = on ? "Live Archives" : "Vault Offline";
            el.className = `status-badge ${on ? 'status-online' : ''}`;
        }
    }

    async function deleteAlbum() {
        if(!confirm("Remove master LP and all tracks?")) return;
        await fetch(`${API_BASE}/${activeId}`, { method: 'DELETE' });
        closeDetailsModal(); loadData();
    }

    function initiateEdit() {
        const a = albums.find(x => x.id === activeId);
        document.getElementById('albumIn').value = a.album_name;
        document.getElementById('artistIn').value = a.artist;
        document.getElementById('moodIn').value = a.mood || "";
        document.getElementById('imgIn').value = a.img || "";
        document.getElementById('trackEditorList').innerHTML = "";
        a.songs.forEach(s => addTrackInput(s.song_title, s.mood, s.rating));
        closeDetailsModal();
        document.getElementById('addModal').classList.add('show');
    }

    async function renameCollectionPrompt() {
        const name = prompt("Enter new title for this Case Archive:");
        if (name && activeCaseId) {
            await fetch(`${COLL_URL}/${activeCaseId}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
            loadData();
        }
    }

    async function deleteCollectionPrompt() {
        if (confirm("Decommission this LP Archive Case? Records will stay in general crates.")) {
            await fetch(`${COLL_URL}/${activeCaseId}`, { method: 'DELETE' });
            closeJournal(); loadData();
        }
    }

    loadData();
</script>
</body>
</html>
