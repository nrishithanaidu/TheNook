<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Nook – Vintage Record Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@900&family=Crimson+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <style>
        :root {
            --wood-medium: #5d3a1a; --wood-dark: #2e1a0b; --neon-orange: #ff8c00;
            --cream: #fdf5e6; --bakelite: #1a1a1a; --brass: #c5a059; --error: #8b0000;
        }
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), repeating-linear-gradient(90deg, #3b2316 0px, #3b2316 100px, #442a1d 101px, #442a1d 200px);
            color: var(--cream); font-family: 'Crimson Text', serif; margin: 0; padding: 0; min-height: 100vh;
        }
        .page-wrap { max-width: 1200px; margin: 0 auto; padding: 40px 20px 100px; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; background: var(--wood-dark); padding: 15px 25px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: #fff; text-shadow: 0 0 10px var(--neon-orange); letter-spacing: 4px; }
        .status-badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-weight: bold; background: #444; color: #aaa; }
        .status-online { color: #50ff50; text-shadow: 0 0 5px #50ff50; }
        .shop-header { background: #111; padding: 50px 30px; border: 8px solid var(--bakelite); outline: 2px solid var(--brass); text-align: center; margin-bottom: 50px; }
        .shop-title { font-family: 'Bebas Neue'; font-size: clamp(40px, 8vw, 70px); letter-spacing: 10px; }
        .btn-gold { background: var(--brass); border: none; color: var(--wood-dark); padding: 12px 28px; font-family: 'Bebas Neue'; font-size: 1.2rem; cursor: pointer; box-shadow: 4px 4px 0px var(--wood-dark); }
        .btn-gold:hover { filter: brightness(1.1); transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--wood-dark); }
        .btn-danger { background: var(--error); color: white; border: none; padding: 10px 20px; font-family: 'Bebas Neue'; cursor: pointer; }
        .vinyl-crate { background: linear-gradient(to bottom, #4a2c1d, #2e1a0b); border: 4px solid var(--wood-dark); border-top: 8px solid var(--wood-medium); padding: 30px 10px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin-top: 50px; }
        .section-banner { font-family: 'Bebas Neue'; font-size: 1.8rem; background: var(--bakelite); padding: 8px 30px; border: 2px solid var(--brass); border-bottom: none; display: inline-block; }
        .vinyl-row { display: flex; gap: 15px; overflow-x: auto; padding: 10px; }
        .record-card { flex: 0 0 170px; background: #fff; padding: 8px; cursor: pointer; transition: 0.3s; box-shadow: 2px 5px 15px rgba(0,0,0,0.4); border: 1px solid #ddd; position: relative; }
        .record-card:hover { transform: translateY(-15px) rotate(1deg); z-index: 10; }
        .record-visual { width: 154px; height: 154px; background: #222; overflow: hidden; }
        .record-visual img { width: 100%; height: 100%; object-fit: cover; }
        .record-title { font-family: 'Bebas Neue'; font-size: 15px; color: #111; margin: 10px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .record-artist { font-size: 12px; color: #555; font-style: italic; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--cream); color: var(--wood-dark); width: 95%; max-width: 600px; padding: 40px; border: 12px solid var(--bakelite); outline: 2px solid var(--brass); max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 32px; cursor: pointer; font-family: 'Bebas Neue'; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--wood-medium); font-size: 13px; text-transform: uppercase; font-family: 'Bebas Neue'; }
        .modal input, .modal textarea, .modal select { width: 100%; padding: 12px; border: 2px solid #ddd; font-family: 'Crimson Text'; font-size: 15px; }

        /* Tracklist Styling */
        .track-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; 
            transition: 0.2s; background: rgba(0,0,0,0.02);
        }
        .track-item:hover { background: rgba(0,0,0,0.08); color: var(--brass); }
        .track-number { font-family: 'Bebas Neue'; opacity: 0.5; margin-right: 15px; }
        .track-details-sub { background: #eee; padding: 20px; margin: 10px 0; border-left: 5px solid var(--brass); display: none; }
        .track-details-sub.active { display: block; animation: slideIn 0.3s; }
        
        .track-input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .track-input-row input { flex: 1; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .stars { display: flex; gap: 5px; font-size: 1.2rem; }
        .star.active { color: var(--brass); }
        .hidden { display: none !important; }
        .search-results { background: #eee; border: 2px solid var(--bakelite); margin: 10px 0; max-height: 200px; overflow-y: auto; }
        .search-item { display: flex; align-items: center; gap: 15px; padding: 10px; cursor: pointer; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="page-wrap">
    <nav>
        <div class="logo-group"><div class="logo">THE NOOK</div><div id="connectionStatus" class="status-badge">Checking...</div></div>
        <button class="btn-gold" onclick="openAddModal()">ADD VINYL LP</button>
    </nav>
    <header class="shop-header">
        <div class="shop-title">VINYL & VIBES</div>
        <div class="shop-subtitle">Established 1959 • The LP Collection</div>
    </header>

    <section class="section"><div class="section-banner">ON THE TURNTABLE</div><div class="vinyl-crate"><div class="vinyl-row" id="now-playing"></div></div></section>
    <section class="section"><div class="section-banner">IN THE CRATE</div><div class="vinyl-crate"><div class="vinyl-row" id="queued"></div></div></section>
    <section class="section"><div class="section-banner">ARCHIVED SESSIONS</div><div class="vinyl-crate"><div class="vinyl-row" id="finished"></div></div></section>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <button class="modal-close" onclick="closeAddModal()">&times;</button>
        <h2 id="modalTitle" style="font-family: 'Bebas Neue'; text-align: center;">Catalog Master LP</h2>
        <div id="magicSection">
            <div class="form-group">
                <label>Magic Search</label>
                <input type="text" id="magicSearch" placeholder="Artist or Album title...">
                <button class="btn-gold" style="width: 100%; margin-top: 10px;" onclick="searchAlbums()">Load Album</button>
            </div>
            <div id="search-results" class="search-results hidden"></div>
        </div>
        <hr style="margin: 25px 0; opacity: 0.1;">
        <input type="hidden" id="albumId">
        <div class="form-group"><label>Album Title</label><input type="text" id="albumIn"></div>
        <div class="form-group"><label>Artist</label><input type="text" id="artistIn"></div>
        <div class="form-group"><label>Overall LP Mood</label><input type="text" id="moodIn" placeholder="e.g. Somber, Orchestral"></div>
        <div class="form-group"><label>Sleeve Art URL</label><input type="text" id="imgIn"></div>
        <div class="form-group"><label>Crate Placement</label><select id="statusIn"><option value="now-playing">On the Turntable</option><option value="queued">In the Crate</option><option value="finished">Archived</option></select></div>
        
        <div class="form-group">
            <label>Tracklist Editor</label>
            <div id="trackEditorList"></div>
            <button class="btn-gold" style="padding: 5px 15px; font-size: 0.9rem; margin-top: 10px;" onclick="addTrackInput()">+ Add Track</button>
        </div>
        
        <button class="btn-gold" style="width: 100%; margin-top: 20px;" id="saveBtn">FILE TO CABINET</button>
    </div>
</div>

<!-- DETAILS VIEW MODAL -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal">
        <button class="modal-close" onclick="closeDetailsModal()">&times;</button>
        <div style="text-align: center;">
            <img id="vImg" style="width: 180px; height: 180px; border: 8px solid var(--bakelite); margin-bottom: 20px;" src="" alt="Cover">
            <h2 id="vAlbumTitle" style="font-family: 'Bebas Neue'; margin: 0;"></h2>
            <p id="vArtist" style="font-style: italic; opacity: 0.7;"></p>
        </div>
        
        <div style="background: #eee; padding: 15px; margin: 20px 0;">
            <div style="display: flex; justify-content: space-between;">
                <span style="font-family: 'Bebas Neue';">Overall Vibe: <span id="vMood" style="color: var(--wood-medium);"></span></span>
                <span id="vRating"></span>
            </div>
        </div>

        <h3 style="font-family: 'Bebas Neue'; border-bottom: 2px solid var(--bakelite); padding-bottom: 5px;">Tracklist (Click for Specs)</h3>
        <div id="vTracklist"></div>

        <div style="display: flex; gap: 15px; margin-top: 40px;">
            <button class="btn-gold" style="flex: 1" onclick="initiateEdit()">EDIT MASTER</button>
            <button class="btn-danger" style="flex: 1" onclick="deleteAlbum()">SCRAP RECORD</button>
        </div>
    </div>
</div>

<script>
    let albums = [];
    let currentTracklist = [];
    const API_BASE = "http://127.0.0.1:5000/api/albums";

    window.onload = loadData;

    async function loadData() {
        try {
            const res = await fetch(API_BASE);
            albums = await res.json();
            updateStatus(true); render();
        } catch (e) { updateStatus(false); }
    }

    function render() {
        ['now-playing', 'queued', 'finished'].forEach(s => document.getElementById(s).innerHTML = "");
        albums.forEach(a => {
            const card = document.createElement('div'); card.className = 'record-card';
            card.innerHTML = `<div class="record-visual"><img src="${a.img || 'https://via.placeholder.com/154/222'}"></div><div class="record-title">${a.album_name}</div><div class="record-artist">${a.artist}</div>`;
            card.onclick = () => openDetails(a);
            document.getElementById(a.status || 'queued').appendChild(card);
        });
    }

    function openDetails(a) {
        document.getElementById('albumId').value = a.id;
        document.getElementById('vAlbumTitle').textContent = a.album_name;
        document.getElementById('vArtist').textContent = a.artist;
        document.getElementById('vMood').textContent = a.mood || "Standard";
        document.getElementById('vRating').innerHTML = "★".repeat(a.rating || 0);
        document.getElementById('vImg').src = a.img || 'https://via.placeholder.com/180/222';
        
        const trackList = document.getElementById('vTracklist');
        trackList.innerHTML = "";
        a.songs.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'track-item';
            row.innerHTML = `<span class="track-title"><span class="track-number">${(i+1).toString().padStart(2, '0')}</span>${s.song_title}</span><div class="stars">${"★".repeat(s.rating || 0)}</div>`;
            
            const detail = document.createElement('div');
            detail.className = 'track-details-sub';
            detail.innerHTML = `
                <div style="font-family: Bebas Neue; color: var(--brass); margin-bottom: 5px;">Track Specifications:</div>
                <div style="font-size: 0.9rem;"><b>Mood:</b> ${s.mood || 'Standard'}</div>
                <div style="font-size: 0.9rem;"><b>Curator Notes:</b> ${s.notes || 'None'}</div>
            `;
            
            row.onclick = () => detail.classList.toggle('active');
            trackList.appendChild(row);
            trackList.appendChild(detail);
        });
        document.getElementById('detailsModal').classList.add('show');
    }

    function addTrackInput(title = "", mood = "", rating = 0, notes = "") {
        const container = document.getElementById('trackEditorList');
        const div = document.createElement('div');
        div.className = 'track-input-block';
        div.style.background = "#eee";
        div.style.padding = "10px";
        div.style.marginBottom = "10px";
        div.innerHTML = `
            <div class="track-input-row">
                <input type="text" placeholder="Song Title" class="t-title" value="${title}">
                <input type="number" placeholder="Rating (0-5)" class="t-rating" min="0" max="5" style="width: 80px" value="${rating}">
            </div>
            <div class="track-input-row">
                <input type="text" placeholder="Mood Tags" class="t-mood" value="${mood}">
                <button class="btn-danger" style="padding: 5px" onclick="this.parentElement.parentElement.remove()">×</button>
            </div>
            <textarea placeholder="Specific Notes for this track..." class="t-notes" rows="1">${notes}</textarea>
        `;
        container.appendChild(div);
    }

    async function searchAlbums() {
        const q = document.getElementById('magicSearch').value;
        const res = await fetch(`http://127.0.0.1:5000/api/magic-music-search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const results = document.getElementById('search-results');
        results.innerHTML = ""; results.classList.remove('hidden');
        data.results.forEach(item => {
            const div = document.createElement('div'); div.className = 'search-item';
            div.innerHTML = `<img src="${item.artwork}" width="50"><div><b>${item.album_name}</b><br><small>${item.artist}</small></div>`;
            div.onclick = () => {
                document.getElementById('albumIn').value = item.album_name;
                document.getElementById('artistIn').value = item.artist;
                document.getElementById('imgIn').value = item.artwork;
                document.getElementById('trackEditorList').innerHTML = "";
                item.songs.forEach(s => addTrackInput(s.song_title));
                results.classList.add('hidden');
            };
            results.appendChild(div);
        });
    }

    document.getElementById('saveBtn').onclick = async () => {
        const id = document.getElementById('albumId').value;
        const songs = [];
        document.querySelectorAll('.track-input-block').forEach(b => {
            songs.push({
                song_title: b.querySelector('.t-title').value,
                mood: b.querySelector('.t-mood').value,
                rating: b.querySelector('.t-rating').value,
                notes: b.querySelector('.t-notes').value
            });
        });

        const payload = {
            album_name: document.getElementById('albumIn').value,
            artist: document.getElementById('artistIn').value,
            mood: document.getElementById('moodIn').value,
            img: document.getElementById('imgIn').value,
            status: document.getElementById('statusIn').value,
            songs: songs
        };

        const method = id ? 'PATCH' : 'POST';
        const url = id ? `${API_BASE}/${id}` : API_BASE;
        await fetch(url, { method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        closeAddModal(); loadData();
    };

    function openAddModal() { 
        document.getElementById('albumId').value = "";
        document.getElementById('albumIn').value = "";
        document.getElementById('artistIn').value = "";
        document.getElementById('trackEditorList').innerHTML = "";
        document.getElementById('addModal').classList.add('show'); 
    }
    function closeAddModal() { document.getElementById('addModal').classList.remove('show'); }
    function closeDetailsModal() { document.getElementById('detailsModal').classList.remove('show'); }
    function updateStatus(on) { 
        const el = document.getElementById('connectionStatus');
        el.textContent = on ? "Live" : "Off";
        el.className = `status-badge ${on ? 'status-online' : ''}`;
    }

    async function deleteAlbum() {
        const id = document.getElementById('albumId').value;
        if(!confirm("Remove master LP and all tracks?")) return;
        await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
        closeDetailsModal(); loadData();
    }

    function initiateEdit() {
        const id = document.getElementById('albumId').value;
        const a = albums.find(x => x.id == id);
        document.getElementById('albumIn').value = a.album_name;
        document.getElementById('artistIn').value = a.artist;
        document.getElementById('moodIn').value = a.mood || "";
        document.getElementById('imgIn').value = a.img || "";
        document.getElementById('trackEditorList').innerHTML = "";
        a.songs.forEach(s => addTrackInput(s.song_title, s.mood, s.rating, s.notes));
        closeDetailsModal();
        document.getElementById('addModal').classList.add('show');
    }
</script>
</body>
</html>
