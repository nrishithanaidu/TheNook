<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Nook — The Hi-Fi Lounge</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root {
  --wood-dark: #1a0f0a; --neon-red: #ff3131; --cream: #f4ece1;
  --bakelite: #121212; --brass: #b89a5a; --error: #8b0000; --ink: #1b1412;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: 'Crimson Text', serif;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), repeating-linear-gradient(90deg, var(--wood-dark) 0px, var(--wood-dark) 100px, #25160e 101px, #25160e 200px);
  color: var(--cream); overflow-x: hidden; min-height: 100vh;
}
.curtain-wrapper { position: fixed; inset: 0; z-index: 1000; pointer-events: none; display: flex; }
.curtain-panel { flex: 1; height: 100vh; background: linear-gradient(90deg, #0a0505, #2b0c12, #1a060a); transition: transform 3.5s; z-index: 1001; border-right: 4px solid var(--brass); }
body.loaded .left-panel { transform: translateX(-100%); } body.loaded .right-panel { transform: translateX(100%); }

header { text-align: center; padding: 100px 20px 20px; }
.on-air-sign { display: inline-block; padding: 10px 30px; background: #222; color: #444; font-family: 'Bebas Neue'; font-size: 2rem; letter-spacing: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: 0.3s; }
body.streaming .on-air-sign { background: #400; color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red); }

.section { margin: 60px auto; max-width: 1200px; padding: 0 20px; }
.section-title { font-family: 'Bebas Neue'; font-size: 2.2rem; color: var(--brass); border-bottom: 2px solid var(--brass); margin-bottom: 40px; display: flex; align-items: center; gap: 15px; }

.now-playing-hero { background: var(--bakelite); border: 15px solid #000; outline: 2px solid var(--brass); padding: 40px; display: flex; gap: 40px; margin-bottom: 80px; box-shadow: 0 40px 80px rgba(0,0,0,0.9); cursor: pointer; transition: 0.3s; }
.reel-visual { 
    width: 180px; height: 180px; 
    background: #333; 
    border-radius: 50%; 
    border: 8px solid #111; 
    display: flex; align-items: center; justify-content: center; 
    position: relative; 
    background-size: cover; 
    background-position: center; 
}
.reel-visual::after { content: ""; width: 30px; height: 30px; background: var(--bakelite); border: 3px solid var(--brass); border-radius: 50%; }
body.streaming .reel-visual { animation: rotateReel 4s linear infinite; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.hero-info { flex: 1; }
.hero-info h4 { font-family: 'Special Elite'; color: var(--brass); margin: 0; font-size: 0.9rem; letter-spacing: 2px; }
.hero-info h2 { font-family: 'Bebas Neue'; margin: 5px 0; font-size: 3rem; color: var(--cream); letter-spacing: 2px; line-height: 1; }
.hero-info p { font-family: 'Crimson Text'; font-style: italic; opacity: 0.8; margin: 10px 0; font-size: 1.2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
.reel-box { background: #2a2a2a; border: 1px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.5); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
.reel-box:hover { transform: translate(-5px, -5px); box-shadow: 15px 15px 0px rgba(0,0,0,0.6); }
.reel-label { background: #eee; margin: 15px; padding: 20px; color: #222; font-family: 'Special Elite'; border-left: 5px solid var(--error); flex-grow: 1; }
.box-bottom { background: var(--bakelite); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(15px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--cream); color: var(--ink); width: 95%; max-width: 600px; padding: 40px; border: 15px solid var(--bakelite); outline: 3px solid var(--brass); max-height: 90vh; overflow-y: auto; position: relative; background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png'); }
.modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 32px; cursor: pointer; font-family: 'Bebas Neue'; color: var(--ink); }

.modal label { color: var(--ink); font-weight: bold; }
.modal input, .modal select, .modal textarea { color: #000; background: rgba(0,0,0,0.05); width: 100%; padding: 10px; border: 2px solid #000; font-family: 'Special Elite'; }

.track-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; background: rgba(0,0,0,0.02); color: var(--ink); align-items: center; }
.track-item:hover { background: rgba(0,0,0,0.08); }
.track-details-sub { background: #eee; padding: 15px; border-left: 5px solid var(--brass); display: none; margin: 5px 0; color: var(--ink); }
.track-details-sub.active { display: block; }

.btn { background: var(--brass); color: #000; font-family: 'Bebas Neue'; font-size: 1.2rem; padding: 10px 20px; border: none; cursor: pointer; letter-spacing: 1px; box-shadow: 3px 3px 0px #000; font-weight: bold; }
.btn:hover { filter: brightness(1.1); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; }
.btn.danger { background: var(--error); color: #fff; }
.btn.secondary { background: #444; color: #fff; box-shadow: 3px 3px 0px #000; }

.search-results { background: rgba(0,0,0,0.05); border: 1px solid #000; margin-top: 10px; max-height: 150px; overflow-y: auto; }
.search-item { display: flex; align-items: center; gap: 10px; padding: 8px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.1); font-family: 'Special Elite'; font-size: 12px; color: var(--ink); }
.hidden { display: none !important; }

.live-indicator { color: var(--neon-red); font-family: 'Bebas Neue'; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 5px; }
.blink { animation: blinker 1.5s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

.status-badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-weight: bold; background: #444; color: #aaa; margin-left: 10px; }
.status-online { color: #50ff50; text-shadow: 0 0 5px #50ff50; }

.stars { display: flex; gap: 8px; font-size: 24px; color: #333; justify-content: center; }
.star { cursor: pointer; transition: color 0.2s; }
.star.active { color: var(--brass); }
</style>
</head>
<body>
<div class="curtain-wrapper"><div class="curtain-panel left-panel"></div><div class="curtain-panel right-panel"></div></div>
<header><div class="on-air-sign" id="on-air">OFF AIR</div><h1>THE HI-FI LOUNGE <span id="connectionStatus" class="status-badge">Off</span></h1><p>Archive Station • Est 1954</p></header>

<section class="section">
    <div class="section-title"><i class="fa-solid fa-tower-broadcast"></i> THE SPOTLIGHT</div>
    <div id="spotlight-container"></div>
</section>

<div style="text-align: center; margin: 40px 0;"><button class="btn" onclick="openAddModal()">+ CATALOG NEW SERIES</button></div>

<section class="section"><div class="section-title"><i class="fa-solid fa-list-ul"></i> UPCOMING SESSIONS</div><div class="grid" id="upcoming-list"></div></section>
<section class="section"><div class="section-title"><i class="fa-solid fa-box-archive"></i> THE VAULT</div><div class="grid" id="past-list"></div></section>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModals()">&times;</button>
        <h2 style="font-family:'Bebas Neue'; text-align:center; font-size:2rem; border-bottom:2px solid #000; color: var(--ink);">LOG MASTER FILE</h2>
        <div style="background:rgba(184,154,90,0.1); padding:15px; margin:15px 0; border:1px dashed var(--brass);">
            <label style="font-family:'Special Elite'; font-weight:bold;">✨ MAGIC FETCH</label>
            <div style="display:flex; gap:10px;"><input type="text" id="magicSearch" placeholder="Search Podcast or Audiobook..." style="flex:1;"><button class="btn" style="font-size:0.9rem;" onclick="searchArchives()">FETCH</button></div>
            <div id="search-results" class="search-results hidden"></div>
        </div>
        <input type="hidden" id="edit-id">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div><label>Title:</label><input type="text" id="new-title"></div>
            <div><label>Host/Author:</label><input type="text" id="new-host"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
            <div><label>Format:</label><select id="new-type"><option value="Podcast">Podcast</option><option value="Audiobook">Audiobook</option></select></div>
            <div><label>Cover URL:</label><input type="text" id="new-img"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
            <div><label>Duration:</label><input type="text" id="new-meta" placeholder="e.g. 1h 20m"></div>
            <div><label>Overall Mood:</label><input type="text" id="new-mood" placeholder="e.g. Noir, Jazzy"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:10px;">
            <div>
                <label>Crate Status:</label>
                <select id="new-status">
                    <option value="upcoming">Upcoming Broadcast</option>
                    <option value="now-playing">Now in Spotlight</option>
                    <option value="past">Archive Vault</option>
                </select>
            </div>
            <div><label>Date Performed:</label><input type="date" id="new-date"></div>
        </div>
        <div style="margin-top:10px;">
            <label>Series Rating:</label>
            <div class="stars" id="mainStarContainer">
                <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
            </div>
        </div>
        <div style="margin-top:10px;">
            <label>Technical Reviews:</label>
            <textarea id="new-notes" rows="2" placeholder="Overall series log..."></textarea>
        </div>
        <div style="margin-top:15px;"><label style="font-family:'Special Elite'; font-size:12px; font-weight:bold;">Episode/Chapter Log:</label><div id="episode-editor"></div><button class="btn" style="font-size:0.8rem; margin-top:10px;" onclick="addEpisodeInput()">+ Add Item</button></div>
        <button class="btn" style="width:100%; margin-top:30px;" onclick="saveSeries()">COMMIT TO VAULT</button>
    </div>
</div>

<!-- DETAILS MODAL -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModals()">&times;</button>
        <div style="text-align:center;">
            <img id="v-img" style="width:150px; height:150px; border:8px solid #000; margin-bottom:15px; object-fit:cover;">
            <h2 id="v-title" style="font-family:'Bebas Neue'; margin:0; font-size:2.2rem; color: var(--ink);"></h2>
            <p id="v-host" style="font-family:'Special Elite'; opacity:0.7; color: var(--ink); margin-bottom: 5px;"></p>
            <div id="v-main-rating"></div>
        </div>
        <div style="margin-top:20px; border-top:2px solid #000; padding-top:10px;"><h3 style="font-family:'Bebas Neue'; font-size:1.2rem; color: var(--ink);">Segments / Chapters (Select to Spotlight)</h3><div id="v-episodes"></div></div>
        <div style="margin-top: 15px; border-top: 1px dashed #000; padding-top: 10px;">
            <label style="font-family:'Bebas Neue'; font-size: 14px; color: var(--ink);">Full Series Review:</label>
            <div id="v-notes-view" style="font-family:'Special Elite'; font-size: 14px; line-height: 1.4; color: var(--ink);"></div>
        </div>
        <div style="display:flex; gap:15px; margin-top:40px;">
            <button class="btn" style="flex: 1" onclick="initiateEdit()">EDIT MASTER</button>
            <button class="btn danger" style="flex: 1" onclick="deleteSeries()">SCRAP FILE</button>
        </div>
    </div>
</div>

<!-- EPISODE EDIT MODAL -->
<div class="modal-overlay" id="episodeEditModal">
    <div class="modal">
        <button class="modal-close" onclick="closeEpisodeEdit()">&times;</button>
        <h2 style="font-family:'Bebas Neue'; text-align:center; font-size:2rem; border-bottom:2px solid #000; color: var(--ink);">TRACK SPECIFICATION LOG</h2>
        <input type="hidden" id="edit-ep-id">
        <div class="form-group"><label>Item Title:</label><input type="text" id="edit-ep-title"></div>
        <div class="form-group"><label>Rating (0-5):</label><input type="number" id="edit-ep-rating" min="0" max="5"></div>
        <div class="form-group"><label>Vibe / Mood:</label><input type="text" id="edit-ep-mood"></div>
        <div class="form-group"><label>Curation Review:</label><textarea id="edit-ep-notes" rows="4"></textarea></div>
        <button class="btn" style="width:100%; margin-top:20px;" onclick="saveSingleEpisode()">COMMIT TRACK CHANGE</button>
    </div>
</div>

<script>
  let podcasts = [];
  let selectedPod = null;
  let currentMainRating = 0;
  const API_BASE = "http://127.0.0.1:5000/api/podcasts";

  window.addEventListener('load', () => { setTimeout(() => document.body.classList.add('loaded'), 1000); loadData(); });

  async function loadData() {
    try {
        const res = await fetch(API_BASE);
        podcasts = await res.json();
        updateStatus(true); render();
    } catch (e) { updateStatus(false); render(); }
  }

  function updateStatus(on) {
    const el = document.getElementById('connectionStatus');
    if(el) { el.innerText = on ? "Live" : "Off"; el.className = `status-badge ${on ? 'status-online' : ''}`; }
  }

  function render() {
    const spotlight = document.getElementById('spotlight-container');
    const upcomingList = document.getElementById('upcoming-list');
    const pastList = document.getElementById('past-list');
    if(spotlight) spotlight.innerHTML = '';
    if(upcomingList) upcomingList.innerHTML = '';
    if(pastList) pastList.innerHTML = '';
    
    const nowPlaying = podcasts.find(p => p.status === 'now-playing');
        if(nowPlaying) {
            document.body.classList.add('streaming'); 
            document.getElementById('on-air').innerText = "ON AIR";
            const activeEp = nowPlaying.episodes.find(e => e.id === nowPlaying.active_episode_id) || nowPlaying.episodes[0] || { episode_title: "General Broadcast" };
            
            spotlight.innerHTML = `
                <div class="now-playing-hero" onclick="openDetails('${nowPlaying.id}')">
                    <div class="reel-visual" style="background-image: url('${nowPlaying.img || 'https://via.placeholder.com/180/333'}')"></div>
                    <div class="hero-info">
                        <div class="live-indicator blink"><i class="fa-solid fa-circle"></i> NOW BROADCASTING</div>
                        <h4>EPISODE: ${activeEp.episode_title}</h4>
                        <h2>${nowPlaying.title}</h2>
                        <p>Hosted by ${nowPlaying.host} • ${nowPlaying.episodes.length} Segments total</p>
                        <div style="margin: 5px 0;">${"★".repeat(activeEp.rating || nowPlaying.rating || 0)}${"☆".repeat(5 - (activeEp.rating || nowPlaying.rating || 0))}</div>
                        
                        <!-- Updated Button Container -->
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <button class="btn" style="font-size:0.8rem; margin-top: 10px;" onclick="event.stopPropagation(); patchStatus('${nowPlaying.id}', 'past')">CONCLUDE & ARCHIVE</button>
                            
                            <button class="btn secondary" style="font-size:0.8rem; margin-top: 10px;" onclick="event.stopPropagation(); patchStatus('${nowPlaying.id}', 'upcoming')">PAUSE / CHANGE</button>
                        </div>
                    </div>
                </div>`;
} else {
        document.body.classList.remove('streaming'); document.getElementById('on-air').innerText = "OFF AIR";
        spotlight.innerHTML = `<div class="now-playing-hero"><div class="reel-visual"></div><div class="hero-info"><h2>SYSTEM IDLE</h2><p>Select a series and stage an episode to begin.</p></div></div>`;
    }

    podcasts.forEach(p => {
        if(p.status === 'now-playing') return;
        const div = document.createElement('div');
        if(p.status === 'upcoming') {
            div.className = 'reel-box'; div.onclick = () => openDetails(p.id);
            div.innerHTML = `<div class="reel-label"><h4>${p.title}</h4><div style="font-size:12px;">${p.host}</div></div><div class="box-bottom"><span style="color:var(--brass); font-family:Bebas Neue;">${p.type}</span><i class="fa-solid fa-tape" style="opacity:0.2"></i></div>`;
            upcomingList.appendChild(div);
        } else {
            div.className = 'reel-box'; div.style.opacity = '0.7'; div.onclick = () => openDetails(p.id);
            div.innerHTML = `<div class="reel-label" style="background:#ccc; border-left-color:#555;"><h4>${p.title}</h4><div style="font-size:12px;">${p.host}</div></div><div class="box-bottom"><span style="color:#777; font-family:Bebas Neue;">ARCHIVED</span></div>`;
            pastList.appendChild(div);
        }
    });
  }

  function openDetails(id) {
    const p = podcasts.find(x => x.id === id); if(!p) return;
    selectedPod = p;
    document.getElementById('v-title').innerText = p.title;
    document.getElementById('v-host').innerText = p.host;
    document.getElementById('v-img').src = p.img || 'https://via.placeholder.com/150';
    document.getElementById('v-main-rating').innerHTML = "★".repeat(p.rating || 0) + "☆".repeat(5 - (p.rating || 0));
    document.getElementById('v-notes-view').innerText = p.notes || "No technical logs recorded.";

    const list = document.getElementById('v-episodes');
    list.innerHTML = '';
    (p.episodes || []).forEach((e, i) => {
        const item = document.createElement('div'); item.className = 'track-item';
        const isActive = (p.active_episode_id === e.id && p.status === 'now-playing');
        item.innerHTML = `
            <span style="${isActive ? 'color: var(--neon-red); font-weight: bold;' : ''}">${(i+1).toString().padStart(2,'0')}. ${e.episode_title}</span>
            <span style="display:flex;gap:12px; align-items:center;">
                ${"★".repeat(e.rating || 0)}
                <i class="fa-solid fa-play" style="color: var(--brass); cursor: pointer;" title="Stage Episode" onclick="event.stopPropagation(); stageEpisode('${p.id}', '${e.id}')"></i>
                <i class="fa-solid fa-edit" style="opacity:0.6; cursor: pointer;" onclick="event.stopPropagation(); openEpisodeEdit('${e.id}')"></i>
            </span>
        `;
        const sub = document.createElement('div'); sub.className = 'track-details-sub';
        sub.innerHTML = `<div><b>Mood:</b> ${e.mood || 'Standard'}<br><b>Note:</b> ${e.notes || 'None'}</div>`;
        item.onclick = () => sub.classList.toggle('active');
        list.appendChild(item); list.appendChild(sub);
    });
    document.getElementById('detailsModal').classList.add('show');
  }

  async function stageEpisode(podId, epId) {
      try {
          await fetch(`${API_BASE}/${podId}`, {
              method: 'PATCH',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ status: 'now-playing', active_episode_id: epId })
          });
          closeModals(); loadData();
      } catch (e) { alert("Failed to stage episode."); }
  }

  async function patchStatus(id, newStatus) {
    try {
        await fetch(`${API_BASE}/${id}`, { 
            method: 'PATCH', headers: {'Content-Type':'application/json'}, 
            body: JSON.stringify({ status: newStatus }) 
        });
        closeModals(); loadData();
    } catch (e) { alert("Action failed."); }
  }

  async function saveSeries() {
    const id = document.getElementById('edit-id').value;
    const eps = [];
    document.querySelectorAll('.ep-input-block').forEach(b => {
        eps.push({ episode_title: b.querySelector('.e-title').value, rating: b.querySelector('.e-rating').value, mood: b.querySelector('.e-mood').value, notes: b.querySelector('.e-review').value });
    });
    const payload = { 
        title: document.getElementById('new-title').value, host: document.getElementById('new-host').value, type: document.getElementById('new-type').value, 
        img: document.getElementById('new-img').value, meta: document.getElementById('new-meta').value, mood: document.getElementById('new-mood').value,
        notes: document.getElementById('new-notes').value, rating: currentMainRating, episodes: eps, status: document.getElementById('new-status').value 
    };
    const method = id ? 'PATCH' : 'POST';
    await fetch(id ? `${API_BASE}/${id}` : API_BASE, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    closeModals(); loadData();
  }

  function addEpisodeInput(title="", rating=0, mood="", notes="") {
    const div = document.createElement('div'); div.className = 'ep-input-block';
    div.style.background = "rgba(0,0,0,0.05)"; div.style.padding = "10px"; div.style.marginBottom = "5px";
    div.innerHTML = `<div style="display:flex; gap:5px;"><input type="text" class="e-title" value="${title}" placeholder="Item Title" style="flex:1;"><input type="number" class="e-rating" value="${rating}" max="5" style="width:50px;"></div><input type="text" class="e-mood" value="${mood}" placeholder="Mood" style="width:100%; margin-top:5px;"><textarea class="e-review" placeholder="Item Review" style="width:100%; margin-top:5px; height:40px;">${notes}</textarea>`;
    document.getElementById('episode-editor').appendChild(div);
  }

  function openAddModal() { 
    document.getElementById('edit-id').value = ""; document.getElementById('episode-editor').innerHTML = ""; 
    document.getElementById('new-title').value = ""; document.getElementById('new-host').value = "";
    document.getElementById('addModal').classList.add('show'); 
  }
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }
  function closeEpisodeEdit() { document.getElementById('episodeEditModal').classList.remove('show'); }
  
  document.querySelectorAll('#mainStarContainer .star').forEach(s => {
    s.onclick = () => { currentMainRating = parseInt(s.dataset.v); updateStars(currentMainRating); };
  });
  function updateStars(v) { document.querySelectorAll('#mainStarContainer .star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= v)); }

  async function searchArchives() {
    const q = document.getElementById('magicSearch').value;
    const res = await fetch(`http://127.0.0.1:5000/api/magic-podcast-search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const results = document.getElementById('search-results'); results.innerHTML = ''; results.classList.remove('hidden');
    data.results.forEach(item => {
        const div = document.createElement('div'); div.className = 'search-item';
        div.innerHTML = `<img src="${item.artwork}" width="30"><div><b>${item.title}</b><br><span>${item.host}</span></div>`;
        div.onclick = () => {
            document.getElementById('new-title').value = item.title; document.getElementById('new-host').value = item.host;
            document.getElementById('new-img').value = item.artwork; document.getElementById('episode-editor').innerHTML = '';
            (item.episodes || []).forEach(e => addEpisodeInput(e.episode_title));
            results.classList.add('hidden');
        };
        results.appendChild(div);
    });
  }

  function openEpisodeEdit(eid) {
      const e = selectedPod.episodes.find(x => x.id === eid);
      if(!e) return;
      document.getElementById('edit-ep-id').value = e.id;
      document.getElementById('edit-ep-title').value = e.episode_title;
      document.getElementById('edit-ep-rating').value = e.rating || 0;
      document.getElementById('edit-ep-mood').value = e.mood || "";
      document.getElementById('edit-ep-notes').value = e.notes || "";
      document.getElementById('episodeEditModal').classList.add('show');
  }

  async function saveSingleEpisode() {
      const payload = { episodes: selectedPod.episodes.map(e => e.id === document.getElementById('edit-ep-id').value ? {
          episode_title: document.getElementById('edit-ep-title').value,
          rating: document.getElementById('edit-ep-rating').value,
          mood: document.getElementById('edit-ep-mood').value,
          notes: document.getElementById('edit-ep-notes').value
      } : e) };
      await fetch(`${API_BASE}/${selectedPod.id}`, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      closeEpisodeEdit(); loadData().then(() => openDetails(selectedPod.id));
  }

  function initiateEdit() {
      const p = selectedPod;
      document.getElementById('edit-id').value = p.id;
      document.getElementById('new-title').value = p.title;
      document.getElementById('new-host').value = p.host;
      document.getElementById('new-img').value = p.img || "";
      document.getElementById('new-status').value = p.status;
      document.getElementById('episode-editor').innerHTML = "";
      (p.episodes || []).forEach(e => addEpisodeInput(e.episode_title, e.rating, e.mood, e.notes));
      closeModals(); document.getElementById('addModal').classList.add('show');
  }

  async function deleteSeries() { if(confirm("Scrap series?")) { await fetch(`${API_BASE}/${selectedPod.id}`, {method:'DELETE'}); closeModals(); loadData(); } }
</script>
</body>
</html>
