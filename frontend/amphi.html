<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Nook — The Hi-Fi Lounge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Text:ital,wght@0,400;1,400&family=Special+Elite&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root {
  --wood-dark: #1a0f0a; --neon-red: #ff3131; --cream: #f4ece1;
  --bakelite: #121212; --brass: #b89a5a; --error: #8b0000; --ink: #1b1412;
  --emblem-red: #8B0000;
  --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
  --gold-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Crimson Text', serif;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), repeating-linear-gradient(90deg, var(--wood-dark) 0px, var(--wood-dark) 100px, #25160e 101px, #25160e 200px);
  color: var(--cream); overflow-x: hidden; min-height: 100vh;
}

/* --- NAVIGATION --- */
.nav-hifi {
    background-color: #0d0806;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    position: sticky;
    top: 0;
    z-index: 1100;
    padding: 0.6rem 0;
    border-bottom: 2px solid var(--brass);
}
.font-title { font-family: 'IM Fell English SC', serif; }
.nav-link { cursor: pointer; transition: all 0.3s ease; }
.nav-link:hover { color: var(--brass); text-shadow: 0 0 10px rgba(184, 154, 90, 0.6); }

header { text-align: center; padding: 60px 20px 20px; }
.on-air-sign { display: inline-block; padding: 10px 30px; background: #222; color: #444; font-family: 'Bebas Neue'; font-size: 2.2rem; letter-spacing: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); transition: 0.3s; }
body.streaming .on-air-sign { background: #400; color: var(--neon-red); box-shadow: 0 0 20px var(--neon-red); }

/* --- TOOLS CONTAINER --- */
.hifi-tools-container {
    max-width: 700px;
    margin: 0 auto 60px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
}

.search-bar {
    display: flex;
    justify-content: center;
    padding: 10px;
    background: rgba(0,0,0,0.6);
    border: 2px solid var(--brass);
    border-radius: 4px;
    position: relative;
}

.search-bar input {
    background: transparent;
    border: none;
    padding: 10px 15px;
    font-family: 'Special Elite';
    font-size: 1.2rem;
    color: white;
    width: 100%;
    outline: none;
    letter-spacing: 1px;
}

/* SEARCH DROPDOWN */
.search-results-area {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--cream);
    border: 3px solid var(--bakelite);
    outline: 1px solid var(--brass);
    border-top: none;
    z-index: 500;
    max-height: 400px;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    padding: 10px;
    background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
}
.search-results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
.search-result-item { cursor: pointer; text-align: center; transition: 0.3s; padding: 10px; border: 1px solid transparent; }
.search-result-item:hover { background: rgba(0,0,0,0.05); border-color: var(--brass); }
.search-result-item img { width: 100%; height: 140px; object-fit: cover; border: 4px solid var(--bakelite); margin-bottom: 5px; }
.search-result-item p { font-size: 11px; font-weight: bold; font-family: 'Bebas Neue'; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 1px; }

.actions-bar { display: flex; justify-content: center; gap: 20px; z-index: 50; }

.section { margin: 60px auto; max-width: 1250px; padding: 0 20px; }
.section-title { font-family: 'Bebas Neue'; font-size: 2.2rem; color: var(--brass); border-bottom: 2px solid var(--brass); margin-bottom: 30px; display: flex; align-items: center; gap: 15px; letter-spacing: 2px; }

.now-playing-hero { background: var(--bakelite); border: 15px solid #000; outline: 2px solid var(--brass); padding: 40px; display: flex; gap: 40px; margin-bottom: 80px; box-shadow: 0 40px 80px rgba(0,0,0,0.9); cursor: pointer; transition: 0.3s; }
.reel-visual { 
    width: 180px; height: 180px; 
    background: #333; 
    border-radius: 50%; 
    border: 8px solid #111; 
    display: flex; align-items: center; justify-content: center; 
    position: relative; 
    background-size: cover; 
    background-position: center; 
}
.reel-visual::after { content: ""; width: 30px; height: 30px; background: var(--bakelite); border: 3px solid var(--brass); border-radius: 50%; }
body.streaming .reel-visual { animation: rotate 4s linear infinite; }
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* --- SHELF & SCROLLING --- */
.shelf-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
.grid { 
    display: flex; 
    gap: 30px; 
    overflow-x: auto; 
    scroll-behavior: smooth; 
    padding: 10px 5px 30px;
    width: 100%;
}
.grid::-webkit-scrollbar { display: none; }

.scroll-btn {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    height: 40px; width: 40px; background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 100; opacity: 0; transition: opacity 0.3s ease;
}
.scroll-btn span {
    background: var(--gold-gradient); width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; 
    border: 1px solid #8a6d3b; box-shadow: var(--gold-shadow);
    color: #443415; font-weight: 900; font-size: 1.1rem;
}
.shelf-wrapper:hover .scroll-btn { opacity: 1; }
.scroll-btn.left { left: -10px; }
.scroll-btn.right { right: -10px; }

.reel-box { flex: 0 0 320px; background: #2a2a2a; border: 1px solid #000; box-shadow: 10px 10px 0px rgba(0,0,0,0.5); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; }
.reel-box:hover { transform: translate(-5px, -5px); box-shadow: 15px 15px 0px rgba(0,0,0,0.6); }
.reel-label { background: #eee; margin: 15px; padding: 20px; color: #222; font-family: 'Special Elite'; border-left: 5px solid var(--error); flex-grow: 1; }
.box-bottom { background: var(--bakelite); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }

/* --- ARCHIVE CASE (RESIZED TO SMALL BOOK PROFILE) --- */
.archive-case {
    flex: 0 0 90px; /* Reduced width strictly to 90px */
    width: 150px;
    height: 200px; /* Reduced height to 130px */
    background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
    border: 2px solid #111;
    border-radius: 3px 8px 8px 3px; 
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 5px 5px 15px rgba(0,0,0,0.7);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border-left: 8px solid #000; /* Journal spine */
}
/* Brass corner detail */
.archive-case::before {
    content: ''; position: absolute; top: 0; right: 0; width: 15px; height: 15px;
    background: radial-gradient(circle at top right, var(--brass) 10%, transparent 70%);
    border-radius: 0 6px 0 0; opacity: 0.6;
}
.archive-case:hover { 
    transform: translateY(-5px) rotate(-1deg); 
    border-color: var(--brass); 
    box-shadow: 10px 15px 25px rgba(0,0,0,0.8); 
}
.case-label {
    background: #fff; padding: 3px 6px; font-family: 'Special Elite'; color: var(--ink); border: 1px solid #ccc;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2); text-transform: uppercase; font-size: 10px; /* Tiny typed label */
    max-width: 90%; text-align: center; word-break: break-word; z-index: 5; position: relative;
}

/* MODALS */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(15px); }
.modal-overlay.show { display: flex; }
.modal { background: var(--cream); color: var(--ink); width: 95%; max-width: 600px; padding: 40px; border: 15px solid var(--bakelite); outline: 3px solid var(--brass); max-height: 90vh; overflow-y: auto; position: relative; background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png'); }
.modal-close { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 32px; cursor: pointer; font-family: 'Bebas Neue'; color: var(--ink); }

.modal label { color: var(--ink); font-weight: bold; margin-bottom: 5px; display: block; font-family: 'Bebas Neue'; letter-spacing: 1px; }
.modal input, .modal select, .modal textarea { color: #000; background: rgba(0,0,0,0.05); width: 100%; padding: 12px; border: 2px solid #000; font-family: 'Special Elite'; border-radius: 2px; }

.track-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; background: rgba(0,0,0,0.02); color: var(--ink); align-items: center; }
.track-item:hover { background: rgba(0,0,0,0.08); }
.track-item .stars-display { margin-left: auto; color: var(--brass); margin-right: 15px; font-family: 'Special Elite'; font-size: 14px; }

.btn { background: var(--brass); color: #000; font-family: 'Bebas Neue'; font-size: 1.2rem; padding: 10px 25px; border: none; cursor: pointer; letter-spacing: 1px; box-shadow: 3px 3px 0px #000; font-weight: bold; border-radius: 4px; transition: 0.2s; }
.btn:hover { filter: brightness(1.1); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px #000; }
.btn.danger { background: var(--error); color: #fff; }

.status-badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; font-weight: bold; background: #333; color: #aaa; margin-left: 10px; }
.status-online { color: #50ff50; text-shadow: 0 0 5px #50ff50; }

.live-indicator { color: var(--neon-red); font-family: 'Bebas Neue'; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 5px; }
.blink { animation: blinker 1.5s linear infinite; }
@keyframes blinker { 50% { opacity: 0; } }

.stars { display: flex; gap: 8px; font-size: 24px; color: #333; justify-content: center; padding: 10px 0; }
.star { cursor: pointer; transition: color 0.2s; }
.star.active { color: var(--brass); }

.remove-icon { position: absolute; top: -10px; right: -10px; background: var(--error); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border: 2px solid white; z-index: 101; opacity: 0; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.reel-box:hover .remove-icon { opacity: 1; }

.selection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 20px; max-height: 400px; overflow-y: auto; padding: 20px; border: 2px solid var(--bakelite); background: #fff; border-radius: 4px; }
.selection-item { cursor: pointer; text-align: center; padding: 10px; transition: 0.3s; }
.selection-item:hover { background: rgba(0,0,0,0.05); transform: scale(1.05); }
.selection-item img { width: 100%; height: 120px; object-fit: cover; border: 2px solid #000; margin-bottom: 5px; }

/* Segment Card Style in Archive */
.assign-container { margin: 25px 0; padding: 20px; background: rgba(0,0,0,0.03); border: 2px dashed var(--brass); border-radius: 4px; }
.song-picker-list { max-height: 200px; overflow-y: auto; background: white; border: 1px solid #ddd; padding: 10px; margin: 15px 0; border-radius: 2px; text-align: left; }
.song-checkbox-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; font-family: 'Special Elite'; color: #000; font-size: 13px; }
.song-checkbox-item input { width: auto; padding: 0; cursor: pointer; }

.segment-card { flex: 0 0 280px; background: #fff; padding: 15px; border: 4px solid var(--bakelite); box-shadow: 8px 8px 0px rgba(0,0,0,0.4); color: #000; }
.segment-card h5 { font-family: 'Special Elite'; font-size: 0.8rem; color: var(--brass); margin-bottom: 5px; }
.segment-card h4 { font-family: 'Bebas Neue'; font-size: 1.4rem; letter-spacing: 1px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.segment-card p { font-style: italic; font-size: 0.9rem; opacity: 0.7; }

.hidden { display: none !important; }
</style>

</head>
<body>


<!-- NAVIGATION BAR -->
<nav class="nav-hifi w-full">
    <div class="flex items-center justify-between px-10 mx-auto max-w-[1400px]">
        <div class="flex items-center space-x-6">
            <div class="w-10 h-10 rounded-full border-2 border-brass flex items-center justify-center font-title text-2xl nav-link text-white" 
                 style="background-color: var(--emblem-red); border-color: var(--brass);" 
                 onclick="window.location.href='nook_homepage_final.html'">N</div>
            <span class="font-title text-3xl font-bold text-white nav-link" onclick="window.location.href='nook_homepage_final.html'">The Nook</span>
            <div id="connectionStatus" class="status-badge">Checking...</div>
        </div>
        <div class="flex items-center text-lg font-title text-white">
            <span class="nav-link flex items-center space-x-2" onclick="window.location.href='user.html'">
                <svg class="w-7 h-7 border-2 border-current rounded-full p-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span data-user-name>Guest</span>
            </span>
                
            <button data-auth-action class="ml-4 nav-link">Login</button>

    
        </div>
    </div>
</nav>

<header>
    <div class="on-air-sign" id="on-air">OFF AIR</div>
    <h1 style="font-family:'Bebas Neue'; font-size:4.5rem; margin:15px 0; letter-spacing:8px; text-shadow: 0 0 15px rgba(0,0,0,0.5);">THE HI-FI LOUNGE</h1>
    <p style="font-style:italic; opacity:0.8; font-size: 1.2rem;">Archive Station • Est 1954</p>
</header>

<!-- TOOLS CONTAINER -->
<div class="hifi-tools-container">
    <div class="search-bar">
        <input type="text" id="hifiSearch" placeholder="LOOK UP A BROADCAST MASTER..." oninput="triggerFilter()">
        <div id="search-results-area" class="search-results-area hidden">
            <div id="search-results-grid" class="search-results-grid"></div>
        </div>
    </div>

    <div class="actions-bar">
        <button class="btn" onclick="openCollectionForgeModal()">+ FORGE COLLECTION</button>
        <button class="btn" onclick="openAddModal()">+ CATALOG NEW SERIES</button>
    </div>
</div>

<section class="section">
    <div class="section-title"><i class="fa-solid fa-tower-broadcast"></i> THE SPOTLIGHT</div>
    <div id="spotlight-container"></div>
</section>

<section class="section">
    <div class="section-title"><i class="fa-solid fa-list-ul"></i> UPCOMING SESSIONS</div>
    <div class="shelf-wrapper">
        <button class="scroll-btn left" onclick="scrollShelf('upcoming-list', -400)"><span>&#10094;</span></button>
        <div class="grid" id="upcoming-list"></div>
        <button class="scroll-btn right" onclick="scrollShelf('upcoming-list', 400)"><span>&#10095;</span></button>
    </div>
</section>

<section class="section">
    <div class="section-title"><i class="fa-solid fa-box-archive"></i> THE VAULT</div>
    <div class="shelf-wrapper">
        <button class="scroll-btn left" onclick="scrollShelf('past-list', -400)"><span>&#10094;</span></button>
        <div class="grid" id="past-list"></div>
        <button class="scroll-btn right" onclick="scrollShelf('past-list', 400)"><span>&#10095;</span></button>
    </div>
</section>

<section class="section" id="collections-section">
    <div class="section-title"><i class="fa-solid fa-folder-open"></i> ARCHIVE COLLECTIONS</div>
    <div class="shelf-wrapper">
        <button class="scroll-btn left" onclick="scrollShelf('collections-list', -400)"><span>&#10094;</span></button>
        <div class="grid" id="collections-list"></div>
        <button class="scroll-btn right" onclick="scrollShelf('collections-list', 400)"><span>&#10095;</span></button>
    </div>
</section>

<div class="text-center mt-20 opacity-30 font-bebas text-xs tracking-widest uppercase pb-20">End of Broadcast Feed</div>

<!-- LOG MASTER MODAL (ADD/EDIT) -->
<div class="modal-overlay" id="addModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModals()">&times;</button>
        <h2 style="font-family:'Bebas Neue'; text-align:center; font-size:2.5rem; border-bottom:4px solid #000; color: var(--ink); margin-bottom: 20px;">LOG MASTER FILE</h2>
        <div style="background:rgba(184,154,90,0.15); padding:20px; margin:15px 0; border:2px dashed var(--brass);">
            <label style="font-family:'Special Elite'; font-weight:bold;">✨ MAGIC FETCH (iTunes API)</label>
            <div style="display:flex; gap:10px;"><input type="text" id="magicSearch" placeholder="Search Podcast or Audiobook title..." style="flex:1;"><button class="btn" style="font-size:0.9rem;" onclick="searchArchives()">FETCH</button></div>
            <div id="magic-search-results" class="search-results hidden"></div>
        </div>
        
        <input type="hidden" id="edit-id">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div><label>Series Title:</label><input type="text" id="new-title"></div>
            <div><label>Host/Author:</label><input type="text" id="new-host"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
            <div><label>Format:</label><select id="new-type"><option value="Podcast">Podcast</option><option value="Audiobook">Audiobook</option></select></div>
            <div><label>Cover Artwork URL:</label><input type="text" id="new-img"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
            <div><label>Duration Metadata:</label><input type="text" id="new-meta" placeholder="e.g. 1h 20m"></div>
            <div><label>Overall Vibe:</label><input type="text" id="new-mood" placeholder="e.g. Noir, Jazzy"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
            <div>
                <label>Archive Status:</label>
                <select id="new-status">
                    <option value="upcoming">Upcoming Broadcast</option>
                    <option value="now-playing">Stage in Spotlight</option>
                    <option value="past">Archive Vault</option>
                </select>
            </div>
            <div><label>Date Logged:</label><input type="date" id="new-date"></div>
        </div>
        <div style="margin-top:15px;">
            <label>Master Rating:</label>
            <div class="stars" id="mainStarContainer">
                <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
            </div>
        </div>
        <div style="margin-top:15px;">
            <label>Curator Logs:</label>
            <textarea id="new-notes" rows="3" placeholder="Log full series notes here..."></textarea>
        </div>
        <div style="margin-top:20px;">
            <label style="font-family:'Special Elite'; font-size:14px; font-weight:bold; color: var(--ink);">Segments / Chapters Log:</label>
            <div id="episode-editor" style="margin-top: 10px;"></div>
            <button class="btn" style="font-size:0.8rem; width: 100%; margin-top:10px;" onclick="addEpisodeInput()">+ ADD SEGMENT</button>
        </div>
        <button class="btn" style="width:100%; margin-top:40px; padding: 15px; font-size: 1.5rem;" onclick="saveSeries()">COMMIT TO VAULT</button>
    </div>
</div>

<!-- DETAILS VIEW MODAL -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal">
        <button class="modal-close" onclick="closeModals()">&times;</button>
        <div style="text-align:center;">
            <img id="v-img" style="width:180px; height:180px; border:10px solid #000; margin-bottom:15px; object-fit:cover; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
            <h2 id="v-title" style="font-family:'Bebas Neue'; margin:0; font-size:2.8rem; color: var(--ink);"></h2>
            <p id="v-host" style="font-family:'Special Elite'; opacity:0.8; color: var(--ink); margin-bottom: 5px; font-size: 1.1rem;"></p>
            <div id="v-main-rating" style="font-size: 1.5rem; color: var(--brass);"></div>
            
            <div class="assign-container">
                <label style="font-family: Bebas Neue; display:block; margin-bottom:10px; font-size: 1rem;">Assign tracks to Archive Case</label>
                <div style="display:flex; gap:10px;">
                    <select id="detailsCollectionSelect" style="flex:2; margin-bottom:0;" onchange="handleCollectionSelect()"></select>
                </div>
                <div id="songPickerSection" class="hidden">
                    <label style="font-family: Special Elite; font-size: 11px; margin-top: 10px; text-align: left;">Select Segments to Include:</label>
                    <div id="songPickerGrid" class="song-picker-list"></div>
                </div>
                <button class="btn" style="width:100%; margin-top:10px; padding: 10px; font-size: 1rem;" onclick="addCurrentToCollection()">CONFIRM ASSIGNMENT</button>
            </div>
        </div>
        <div style="margin-top:30px; border-top:3px solid #000; padding-top:15px;">
            <h3 style="font-family:'Bebas Neue'; font-size:1.5rem; color: var(--ink); margin-bottom: 10px;">Segments / Chapters</h3>
            <div id="v-episodes"></div>
        </div>
        <div style="margin-top: 20px; border-top: 1px dashed #000; padding-top: 15px;">
            <label style="font-family:'Bebas Neue'; font-size: 14px; color: var(--ink); display: block; margin-bottom: 5px;">Archival Curator Logs:</label>
            <div id="v-notes-view" style="font-family:'Special Elite'; font-size: 14px; line-height: 1.5; color: var(--ink); background: rgba(0,0,0,0.02); padding: 15px;"></div>
        </div>
        <div style="display:flex; gap:15px; margin-top:40px;">
            <button class="btn" style="flex: 1" onclick="initiateEdit()">EDIT MASTER</button>
            <button class="btn danger" style="flex: 1" onclick="deleteSeries()">SCRAP FILE</button>
        </div>
    </div>
</div>

<!-- COLLECTION OVERLAY -->
<div class="modal-overlay" id="collectionOverlay">
    <div class="modal" style="max-width: 1000px;">
        <button class="modal-close" onclick="closeModals()">&times;</button>
        <div class="text-center border-b-4 border-bakelite pb-8 mb-8">
            <h2 id="collectionJournalTitle" style="font-family: Bebas Neue; font-size: 3.5rem; letter-spacing: 5px;">Collection</h2>
            <div class="flex justify-center gap-6 mt-6">
                <button onclick="openSelectionModal()" class="btn">+ ADD TRACKS</button>
                <button onclick="renameCollectionPrompt()" class="btn">RENAME CASE</button>
                <button class="btn danger" onclick="deleteCollectionPrompt()">DECOMMISSION</button>
            </div>
        </div>
        <div class="grid" id="collectionGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></div>
    </div>
</div>

<!-- SELECTION MODAL -->
<div class="modal-overlay" id="selectionModal" style="z-index: 4500;">
    <div class="modal" style="max-width: 750px;">
        <button class="modal-close" onclick="closeSelectionModal()">&times;</button>
        <h3 id="selectionHeader" style="font-size: 2rem; text-align: center;">SELECT BROADCAST</h3>
        <p id="selectionSub" style="text-align: center; color: var(--wood-medium); font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px;">Assign archived series to this case</p>
        <div class="selection-grid" id="selectionGrid"></div>
        <div id="selectionSongPicker" class="hidden">
            <div id="selectionSongPickerGrid" class="song-picker-list"></div>
            <div class="flex gap-4">
                <button class="btn flex-1" onclick="confirmSelectionAdd()">ADD SELECTED TRACKS</button>
                <button class="btn flex-1" style="background:#666; color:white; box-shadow:none;" onclick="cancelSelectionSongPicker()">BACK TO MASTERS</button>
            </div>
        </div>
        <div id="selectionActions" class="text-center mt-10"><button class="btn" style="background:#333; color:white; box-shadow:none;" onclick="closeSelectionModal()">CANCEL SEARCH</button></div>
    </div>
</div>

<!-- NEW COLLECTION MODAL -->
<div class="modal-overlay" id="newCollectionModal">
  <div class="modal" style="max-width: 450px;">
    <button class="modal-close" onclick="closeModals()">&times;</button>
    <h2 style="text-align: center; margin-bottom: 20px;">NEW ARCHIVE CASE</h2>
    <div class="form-group"><label>Case Identification Label</label><input id="collectionTitle" placeholder="e.g. Mystery Logs..."></div>
    <button class="btn" style="width:100%; margin-top: 10px;" onclick="createCollection()">FORGE CASE</button>
  </div>
</div>

<script type="module">
import Auth, { bootstrapAuth } from "./auth.js";
window.Auth = Auth;

  let podcasts = [];
  let customCollections = [];
  let activeId = null;
  let activeCaseId = null;
  let currentMainRating = 0;
  let selectedPodForArchive = null;
  const API_BASE = "/api/podcasts";
  const COLL_URL = "/api/collections";

  function scrollShelf(id, amount) { const el = document.getElementById(id); if(el) el.scrollLeft += amount; }

  async function loadData() {
    try {
        const [podRes, collRes] = await Promise.all([Auth.apiCall(API_BASE), Auth.apiCall(`${COLL_URL}?media_type=episode`)]);
        podcasts = await podRes.json();
        customCollections = await collRes.json();
        updateStatus(true); updateDropdowns(); render();
        if (activeCaseId) openJournal(activeCaseId);
    } catch (e) { updateStatus(false); render(); }
  }

  function updateStatus(on) {
    const el = document.getElementById('connectionStatus');
    if(el) { el.innerText = on ? "Live Archives" : "Vault Offline"; el.className = `status-badge ${on ? 'status-online' : ''}`; }
  }

  function triggerFilter() {
      const q = document.getElementById('hifiSearch').value.toLowerCase().trim();
      const area = document.getElementById('search-results-area');
      const grid = document.getElementById('search-results-grid');
      if (q === "") { area.classList.add('hidden'); return; }
      const filtered = podcasts.filter(p => p.title.toLowerCase().includes(q) || p.host.toLowerCase().includes(q));
      grid.innerHTML = "";
      if (filtered.length > 0) {
          area.classList.remove('hidden');
          filtered.forEach(p => {
              const item = document.createElement('div');
              item.className = 'search-result-item';
              item.innerHTML = `<img src="${p.img || 'https://via.placeholder.com/154/222'}"><p>${p.title}</p>`;
              item.onclick = () => { area.classList.add('hidden'); openDetails(p.id); };
              grid.appendChild(item);
          });
      } else { grid.innerHTML = "<p style='color:var(--ink); text-align:center; width:100%; padding:20px; font-family:Special Elite;'>Broadcast not found.</p>"; area.classList.remove('hidden'); }
  }

  function render() {
    const spotlight = document.getElementById('spotlight-container');
    ['upcoming-list', 'past-list', 'collections-list'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
    
    customCollections.forEach(c => {
        const div = document.createElement('div');
        div.className = 'archive-case';
        div.innerHTML = `<div class="case-label">${c.name}</div>`;
        div.onclick = () => openJournal(c.id);
        const colList = document.getElementById('collections-list');
        if(colList) colList.appendChild(div);
    });

    const nowPlaying = podcasts.find(p => p.status === 'now-playing');
    if(nowPlaying) {
        document.body.classList.add('streaming'); 
        document.getElementById('on-air').innerText = "ON AIR";
        const activeEp = nowPlaying.episodes.find(e => e.id === nowPlaying.active_episode_id) || nowPlaying.episodes[0] || { episode_title: "Master Feed" };
        spotlight.innerHTML = `
            <div class="now-playing-hero" onclick="openDetails('${nowPlaying.id}')">
                <div class="reel-visual" style="background-image: url('${nowPlaying.img || 'https://via.placeholder.com/180/333'}')"></div>
                <div class="hero-info">
                    <div class="live-indicator blink"><i class="fa-solid fa-circle"></i> NOW BROADCASTING</div>
                    <h4>SEGMENT: ${activeEp.episode_title}</h4>
                    <h2>${nowPlaying.title}</h2>
                    <p>Hosted by ${nowPlaying.host} • ${nowPlaying.episodes.length} Segments total</p>
                    <div style="margin: 5px 0; color: var(--brass); font-size: 1.2rem;">${"★".repeat(activeEp.rating || nowPlaying.rating || 0)}</div>
                    <div class="flex gap-4 mt-4">
                        <button class="btn" style="font-size:0.8rem;" onclick="event.stopPropagation(); patchStatus('${nowPlaying.id}', 'past')">CONCLUDE BROADCAST</button>
                        <button class="btn" style="font-size:0.8rem; background:#444;" onclick="event.stopPropagation(); patchStatus('${nowPlaying.id}', 'upcoming')">PAUSE SESSION</button>
                    </div>
                </div>
            </div>`;
    } else {
        document.body.classList.remove('streaming'); document.getElementById('on-air').innerText = "OFF AIR";
        spotlight.innerHTML = `<div class="now-playing-hero" style="justify-content:center; opacity:0.5; cursor:default;"><div class="hero-info" style="text-align:center;"><h2>SYSTEM IDLE</h2><p>Catalog or select a broadcast master from Upcoming to begin.</p></div></div>`;
    }

    podcasts.forEach(p => {
        if(p.status === 'now-playing') return;
        const div = document.createElement('div');
        div.className = 'reel-box'; div.onclick = () => openDetails(p.id);
        const header = p.status === 'past' ? '<span style="color:#777;">[ ARCHIVED ]</span>' : '';
        div.innerHTML = `<div class="reel-label"><h4>${p.title}</h4><div style="font-size:12px;">${p.host} ${header}</div></div><div class="box-bottom"><span style="color:var(--brass); font-family:Bebas Neue;">${p.type}</span><i class="fa-solid fa-tape" style="opacity:0.2"></i></div>`;
        const listId = p.status === 'upcoming' ? 'upcoming-list' : 'past-list';
        const target = document.getElementById(listId);
        if(target) target.appendChild(div);
    });
  }

  function openDetails(id) {
    const p = podcasts.find(x => x.id === id); if(!p) return;
    activeId = id;
    document.getElementById('v-title').innerText = p.title;
    document.getElementById('v-host').innerText = p.host;
    document.getElementById('v-img').src = p.img || 'https://via.placeholder.com/150';
    document.getElementById('v-main-rating').innerHTML = "★".repeat(p.rating || 0) + "☆".repeat(5 - (p.rating || 0));
    document.getElementById('v-notes-view').innerText = p.notes || "No Curator logs found.";

    const list = document.getElementById('v-episodes');
    const songPicker = document.getElementById('songPickerGrid');
    list.innerHTML = ''; songPicker.innerHTML = '';
    document.getElementById('detailsCollectionSelect').value = "";
    document.getElementById('songPickerSection').classList.add('hidden');

    (p.episodes || []).forEach((e, i) => {
        const item = document.createElement('div'); item.className = 'track-item';
        item.innerHTML = `<span>${(i+1).toString().padStart(2,'0')}. ${e.episode_title}</span><span class="stars-display">${"★".repeat(e.rating || 0)}</span><i class="fa-solid fa-play" style="color: var(--brass); cursor: pointer;" onclick="event.stopPropagation(); stageEpisode('${p.id}', '${e.id}')"></i>`;
        list.appendChild(item);
        const check = document.createElement('div');
        check.className = 'song-checkbox-item';
        check.innerHTML = `<input type="checkbox" class="song-picker-checkbox" value="${e.episode_title}"> <span>${e.episode_title}</span>`;
        songPicker.appendChild(check);
    });
    document.getElementById('detailsModal').classList.add('show');
  }

  function handleCollectionSelect() {
      const val = document.getElementById('detailsCollectionSelect').value;
      if(val) document.getElementById('songPickerSection').classList.remove('hidden');
      else document.getElementById('songPickerSection').classList.add('hidden');
  }

  async function addCurrentToCollection() {
    const target = document.getElementById('detailsCollectionSelect').value;
    const checks = document.querySelectorAll('.song-picker-checkbox:checked');
    if(!target || checks.length === 0) return alert("Select a case and segments!");
    
    const p = podcasts.find(x => x.id === activeId);
    if(!p) return;
    
    for (let cb of checks) {
        const episodeTitle = cb.value;
        const episode = p.episodes.find(e => e.episode_title === episodeTitle);
        if(episode) {
            await Auth.apiCall(`${COLL_URL}/${target}/items`, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    item_id: episode.id,
                    note: `Track: ${episodeTitle}` 
                }) 
            });
        }
    }
    alert("Segments Filed!"); 
    document.getElementById('songPickerSection').classList.add('hidden');
    document.getElementById('detailsCollectionSelect').value = "";
    loadData();
  }

  function openJournal(id) {
    activeCaseId = id;
    const case_pod = customCollections.find(c => c.id === id);
    if(!case_pod) return;
    document.getElementById('collectionJournalTitle').innerText = case_pod.name;
    const grid = document.getElementById('collectionGrid');
    grid.innerHTML = "";
    
    if(!case_pod.items || case_pod.items.length === 0) {
        grid.innerHTML = '<p style="opacity:0.5; grid-column:1/-1; text-align:center; padding: 40px;">Archive case unassigned.</p>';
    } else {
        case_pod.items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'segment-card'; 
            div.style.position = 'relative';
            
            const trackName = item.note && item.note.startsWith("Track: ") 
                ? item.note.replace("Track: ", "") 
                : item.title || "Broadcast Track";
            
            div.innerHTML = `
                <h5>SERIES: ${item.podcast || 'Unknown Series'}</h5>
                <h4>${trackName}</h4>
                <p>Rating: ${"★".repeat(item.rating || 0)}</p>
            `;
            
            const del = document.createElement('div');
            del.className = 'remove-icon'; 
            del.innerHTML = '&times;';
            del.onclick = async (e) => {
                e.stopPropagation();
                await Auth.apiCall(`${COLL_URL}/${activeCaseId}/items/${item.id}`, { 
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: item.note })
                });
                loadData();
            };
            div.appendChild(del);
            grid.appendChild(div);
        });
    }
    document.getElementById('collectionOverlay').classList.add('show');
}

  function openSelectionModal() {
    document.getElementById('selectionGrid').classList.remove('hidden');
    document.getElementById('selectionSongPicker').classList.add('hidden');
    document.getElementById('selectionActions').classList.remove('hidden');
    const grid = document.getElementById('selectionGrid');
    grid.innerHTML = "";
    podcasts.forEach(p => {
        const item = document.createElement('div');
        item.className = 'selection-item';
        item.innerHTML = `<img src="${p.img || 'https://via.placeholder.com/150'}"><b>${p.title}</b>`;
        item.onclick = () => openSelectionSongPicker(p);
        grid.appendChild(item);
    });
    document.getElementById('selectionModal').classList.add('show');
  }

  function openSelectionSongPicker(pod) {
      selectedPodForArchive = pod;
      document.getElementById('selectionGrid').classList.add('hidden');
      document.getElementById('selectionActions').classList.add('hidden');
      document.getElementById('selectionSongPicker').classList.remove('hidden');
      document.getElementById('selectionHeader').innerText = pod.title;
      const pickerGrid = document.getElementById('selectionSongPickerGrid');
      pickerGrid.innerHTML = "";
      pod.episodes.forEach(s => {
          const div = document.createElement('div'); div.className = 'song-checkbox-item';
          div.innerHTML = `<input type="checkbox" class="sel-episode-check" value="${s.episode_title}"> <span>${s.episode_title}</span>`;
          pickerGrid.appendChild(div);
      });
  }

  function cancelSelectionSongPicker() { selectedPodForArchive = null; openSelectionModal(); }

  async function confirmSelectionAdd() {
    const checks = document.querySelectorAll('.sel-episode-check:checked');
    if (checks.length === 0) return alert("Select at least one segment!");
    if (!selectedPodForArchive) return;
    
    for (let cb of checks) {
        const episodeTitle = cb.value;
        const episode = selectedPodForArchive.episodes.find(e => e.episode_title === episodeTitle);
        if(episode) {
            await Auth.apiCall(`${COLL_URL}/${activeCaseId}/items`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ 
                    item_id: episode.id,
                    note: `Track: ${episodeTitle}` 
                }) 
            });
        }
    }
    selectedPodForArchive = null;
    closeSelectionModal(); 
    loadData();
}

  function updateDropdowns() {
    const select = document.getElementById('detailsCollectionSelect');
    if(!select) return;
    select.innerHTML = '<option value="">Select Case Archive...</option>';
    customCollections.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id; opt.textContent = c.name;
        select.appendChild(opt);
    });
  }

  async function createCollection() {
    const name = document.getElementById('collectionTitle').value.trim();
    if(!name) return;
    await Auth.apiCall(COLL_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, media_type: 'episode' }) });
    closeModals(); loadData();
  }

  function openCollectionForgeModal() { document.getElementById('newCollectionModal').classList.add('show'); }
  function closeSelectionModal() { document.getElementById('selectionModal').classList.remove('show'); }
  function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }

  async function openAddModal() { 
    activeId = null; document.getElementById('edit-id').value = ""; document.getElementById('episode-editor').innerHTML = ""; 
    document.getElementById('new-title').value = ""; document.getElementById('new-host').value = "";
    document.getElementById('new-img').value = ""; document.getElementById('new-meta').value = "";
    document.getElementById('new-mood').value = ""; document.getElementById('new-notes').value = "";
    document.getElementById('new-date').value = ""; document.getElementById('new-status').value = "upcoming";
    currentMainRating = 0; updateStars(0);
    document.getElementById('addModal').classList.add('show'); 
  }

  function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
}



  function addEpisodeInput(title="", rating=0) {
    const div = document.createElement('div'); div.className = 'ep-input-block';
    div.style.background = "rgba(0,0,0,0.08)"; div.style.padding = "10px"; div.style.marginBottom = "8px";
    div.innerHTML = `<div style="display:flex; gap:10px;"><input type="text" class="e-title" value="${title}" placeholder="Segment Title" style="flex:2;"><input type="number" class="e-rating" value="${rating}" max="5" placeholder="Rating" style="flex:0.5;"></div>`;
    document.getElementById('episode-editor').appendChild(div);
  }

  async function saveSeries() {
    const id = document.getElementById('edit-id').value;
    const eps = [];
    document.querySelectorAll('.ep-input-block').forEach(b => { eps.push({ episode_title: b.querySelector('.e-title').value, rating: b.querySelector('.e-rating').value }); });
    const payload = { title: document.getElementById('new-title').value, host: document.getElementById('new-host').value, type: document.getElementById('new-type').value, img: document.getElementById('new-img').value, meta: document.getElementById('new-meta').value, mood: document.getElementById('new-mood').value, notes: document.getElementById('new-notes').value, date: document.getElementById('new-date').value, rating: currentMainRating, episodes: eps, status: document.getElementById('new-status').value };
    const method = id ? 'PATCH' : 'POST';
    await Auth.apiCall(id ? `${API_BASE}/${id}` : API_BASE, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    closeModals(); loadData();
  }

  async function searchArchives() {
    const q = document.getElementById('magicSearch').value;
    if(!q) return;
    const btn = document.querySelector('#addModal .btn');
    btn.innerText = "FETCHING..."; btn.disabled = true;
    try {
        const res = await Auth.apiCall(`/api/magic-podcast-search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const results = document.getElementById('magic-search-results'); results.innerHTML = ''; results.classList.remove('hidden');
        data.results.forEach(item => {
            const div = document.createElement('div'); div.className = 'search-item';
            div.innerHTML = `<img src="${item.artwork}" width="30"><div><b>${item.title}</b><br><span>${item.host}</span></div>`;
            div.onclick = () => {
                document.getElementById('new-title').value = item.title; document.getElementById('new-host').value = item.host;
                document.getElementById('new-img').value = item.artwork; document.getElementById('episode-editor').innerHTML = '';
                (item.episodes || []).forEach(e => addEpisodeInput(e.episode_title));
                results.classList.add('hidden');
            };
            results.appendChild(div);
        });
    } finally { btn.innerText = "FETCH"; btn.disabled = false; }
  }

  async function stageEpisode(podId, epId) { await Auth.apiCall(`${API_BASE}/${podId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: 'now-playing', active_episode_id: epId }) }); closeModals(); loadData(); }
  async function patchStatus(id, newStatus) { await Auth.apiCall(`${API_BASE}/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) }); closeModals(); loadData(); }
  document.querySelectorAll('#mainStarContainer .star').forEach(s => { s.onclick = () => { currentMainRating = parseInt(s.dataset.v); updateStars(currentMainRating); }; });
  function updateStars(v) { document.querySelectorAll('#mainStarContainer .star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= v)); }
  function initiateEdit() {
      const p = podcasts.find(x => x.id === activeId);
      document.getElementById('edit-id').value = p.id; document.getElementById('new-title').value = p.title; document.getElementById('new-host').value = p.host;
      document.getElementById('new-img').value = p.img || ""; document.getElementById('new-status').value = p.status;
      document.getElementById('new-mood').value = p.mood || ""; document.getElementById('new-notes').value = p.notes || "";
      document.getElementById('new-date').value = p.date_performed || ""; document.getElementById('new-meta').value = p.duration || "";
      currentMainRating = p.rating || 0; updateStars(currentMainRating);
      document.getElementById('episode-editor').innerHTML = ""; (p.episodes || []).forEach(e => addEpisodeInput(e.episode_title, e.rating));
      closeModals(); document.getElementById('addModal').classList.add('show');
  }
  async function deleteSeries() { if(confirm("Scrap master archive file?")) { await Auth.apiCall(`${API_BASE}/${activeId}`, {method:'DELETE'}); closeModals(); loadData(); } }
  async function renameCollectionPrompt() {
      const name = prompt("Identification Change for Archive Case:");
      if (name && activeCaseId) { await Auth.apiCall(`${COLL_URL}/${activeCaseId}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }); loadData(); }
  }
  

  async function deleteCollectionPrompt() {
      if (confirm("Decommission this Archive Case? Series logs will remain in Vault.")) { await Auth.apiCall(`${COLL_URL}/${activeCaseId}`, { method: 'DELETE' }); closeModals(); loadData(); }
  }


  // ===== EXPOSE FUNCTIONS USED BY HTML =====
window.handleCollectionSelect = handleCollectionSelect;
window.openSelectionSongPicker = openSelectionSongPicker;
window.cancelSelectionSongPicker = cancelSelectionSongPicker;
window.confirmSelectionAdd = confirmSelectionAdd;
window.createCollection = createCollection;
window.addEpisodeInput = addEpisodeInput;
window.saveSeries = saveSeries;
window.searchArchives = searchArchives;
window.stageEpisode = stageEpisode;
window.patchStatus = patchStatus;
window.updateStars = updateStars;
window.scrollShelf = scrollShelf;
window.triggerFilter = triggerFilter;

window.openAddModal = openAddModal;
window.closeAddModal = closeAddModal;

window.openCollectionForgeModal = openCollectionForgeModal;
window.openSelectionModal = openSelectionModal;
window.closeSelectionModal = closeSelectionModal;

window.openJournal = openJournal;
window.closeModals = closeModals;

window.openDetails = openDetails;
window.addCurrentToCollection = addCurrentToCollection;

window.renameCollectionPrompt = renameCollectionPrompt;
window.deleteCollectionPrompt = deleteCollectionPrompt;

window.initiateEdit = initiateEdit;
window.deleteSeries = deleteSeries;

window.addCurrentToCollection = addCurrentToCollection;
window.confirmSelectionAdd = confirmSelectionAdd;
window.openJournal = openJournal;


   document.addEventListener("DOMContentLoaded", async () => {
    await bootstrapAuth({ requireAuth: true });
    await loadData();
});
</script>
</body>
</html>
